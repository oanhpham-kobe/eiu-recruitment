name: One-shot Review CI Handoff Protocol Patch

on:
  push:
    branches:
      - maintenance/review-ci-handoff-protocol-001

permissions:
  contents: write

concurrency:
  group: review-ci-handoff-protocol-patch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-review-ci-protocol]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/review-ci-handoff-protocol-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Apply fail-closed patch
        shell: bash
        run: |
          set -euo pipefail
          python project_control/tools/_apply_review_ci_handoff_protocol_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/integration-ci.yml')
          t = p.read_text(encoding='utf-8')
          t = t.replace("printf '%s\n' 'FULL VERIFICATION REQUESTED (broadening only)'", "printf '%s\\n' 'FULL VERIFICATION REQUESTED (broadening only)'")
          t = t.replace("printf '%s\n' 'Changed files:'", "printf '%s\\n' 'Changed files:'")
          p.write_text(t, encoding='utf-8')
          PY
      - name: Validate patched governance and workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          python project_control/validate_omp_native.py
          python project_control/validate_control_plane.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          for p in ('.github/workflows/governance-ci.yml', '.github/workflows/integration-ci.yml'):
              yaml.safe_load(Path(p).read_text(encoding='utf-8'))
              print(f'YAML parse PASS: {p}')
          PY
          git diff --check
      - name: Commit protocol patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/governance-ci.yml .github/workflows/integration-ci.yml .omp/RULES.md AGENTS.md REVIEW.md project_control/AUTONOMY_PARALLEL_GOVERNANCE.md project_control/AUTONOMY_RUN_STATE.yaml project_control/CHANGELOG_IMPLEMENTATION.md project_control/CURRENT_STATE.md
          git diff --cached --check
          git commit -m "chore: formalize review CI and safe handoff protocol [skip-review-ci-protocol]"
          git push origin HEAD:maintenance/review-ci-handoff-protocol-001
