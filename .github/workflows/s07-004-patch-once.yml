name: S07-004 One-shot Entrypoint Repair

on:
  push:
    branches:
      - chatgpt/TASK-S07-004-physical-storage-cleanup-runner

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2
      - name: Replace top-level await with async entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/__tests__/storage-cleanup-local.integration.ts')
          text = path.read_text()
          old = '''try {
            await main();
          } finally {
            await cleanupObjects();
          }'''
          new = '''async function runIntegration(): Promise<void> {
            try {
              await main();
            } finally {
              await cleanupObjects();
            }
          }

          void runIntegration().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });'''
          if old not in text:
              raise SystemExit('expected entrypoint text not found')
          path.write_text(text.replace(old, new))
          PY
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ensure npm 11.19.0
        run: |
          if [ "$(npm --version)" != "11.19.0" ]; then npm install --global npm@11.19.0; fi
          test "$(npm --version)" = "11.19.0"
      - run: npm ci --prefix web
      - name: Format repaired file
        working-directory: web
        run: npx biome check --write src/__tests__/storage-cleanup-local.integration.ts
      - name: Commit bounded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/__tests__/storage-cleanup-local.integration.ts
          git diff --cached --check
          git commit -m 'test(storage): repair local integration entrypoint'
          git push origin HEAD:chatgpt/TASK-S07-004-physical-storage-cleanup-runner
