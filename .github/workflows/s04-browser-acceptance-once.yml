name: S04 Interview Browser Acceptance Once

on:
  push:
    branches:
      - oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
    paths:
      - .github/workflows/s04-browser-acceptance-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply browser acceptance repairs
        run: |
          python .github/s04_browser_patch.py
          python .github/s04_status_menu_patch.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Format affected files
        working-directory: web
        run: npx biome check --write src/components/interview/InterviewPage.tsx src/components/ui/StatusMenu.tsx src/styles/interview.css src/__tests__/interview-browser-acceptance.test.ts src/__tests__/fixtures/interview-browser-acceptance-harness.tsx
      - name: Lint affected files
        working-directory: web
        run: npx biome check src/components/interview/InterviewPage.tsx src/components/ui/StatusMenu.tsx src/styles/interview.css src/__tests__/interview-browser-acceptance.test.ts src/__tests__/fixtures/interview-browser-acceptance-harness.tsx
      - name: Design contract check
        working-directory: web
        run: npm run design:check
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Shared primitive browser invariant
        working-directory: web
        run: node --test --import tsx src/__tests__/design-primitives-browser.test.ts
      - name: Seven-width Interview browser acceptance
        working-directory: web
        run: node --test --import tsx src/__tests__/interview-browser-acceptance.test.ts
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Commit verified browser acceptance and remove staging helpers
        shell: bash
        run: |
          rm .github/workflows/s04-browser-acceptance-once.yml
          rm .github/s04_browser_patch.py
          rm .github/s04_status_menu_patch.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(s04): enforce interview responsive acceptance"
          git push origin HEAD:oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
