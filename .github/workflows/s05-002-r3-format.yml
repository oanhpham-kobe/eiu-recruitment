name: S05-002 R3 Format

on:
  push:
    branches:
      - verify/S05-002-R3-5883680

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'biome-format') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Repair the exact Drawer close selector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/__tests__/hr-report-browser.test.ts')
          text = path.read_text()
          old = 'drawer.getByRole("button", { name: "Đóng" }).click()'
          new = 'drawer.getByRole("button", { name: "Đóng", exact: true }).click()'
          if old not in text:
              raise SystemExit('expected close selector not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx biome check --write src/__tests__/hr-report-browser.test.ts
      - name: Commit exact test repair
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/__tests__/hr-report-browser.test.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(s05-002): biome-format exact close selector"
            git push
          fi
