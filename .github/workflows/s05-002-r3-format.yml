name: S05-002 R3 Fixture Scope Repair

on:
  push:
    branches:
      - verify/S05-002-R3-5883680

permissions:
  contents: write

jobs:
  repair-fixture-scope:
    if: ${{ !contains(github.event.head_commit.message, 'fixture-scope-repair') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Scope HR fixture read away from prior regression data
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/hr_report_management_test.sql')
          text = path.read_text()
          old = """  perform set_config(\n    'request.jwt.claims',\n    jsonb_build_object('sub', v_hr_auth::text)::text,\n    true\n  );\n  v_result := public.get_hr_report_page(1, 20, null, 'ALL', null, 'CANDIDATE_ASC');\n"""
          new = """  perform set_config(\n    'request.jwt.claims',\n    jsonb_build_object('sub', v_hr_auth::text)::text,\n    true\n  );\n  v_result := public.get_hr_report_page(\n    1, 20, null, 'ALL', 'S05-002 Candidate', 'CANDIDATE_ASC'\n  );\n"""
          if old not in text:
              raise SystemExit('authorized HR read block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fixture scope repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/hr_report_management_test.sql
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "test(s05-002): fixture-scope-repair"
            git push
          fi
