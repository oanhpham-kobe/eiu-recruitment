name: S08-002 Candidate Mutation Helper

on:
  push:
    branches:
      - work/S08-002-candidate-mutation-v1

permissions:
  contents: write

jobs:
  web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Materialize server-only Candidate mutation wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/commands/types.ts')
          text = p.read_text()
          text = text.replace(
              '  INTERNAL_ERROR = "INTERNAL_ERROR",\n',
              '  RATE_LIMITED = "RATE_LIMITED",\n  RATE_LIMIT_UNAVAILABLE = "RATE_LIMIT_UNAVAILABLE",\n  INTERNAL_ERROR = "INTERNAL_ERROR",\n',
              1,
          )
          text = text.replace(
              'export type VerifiedActor = {\n  authUserId: string;\n',
              'export type VerifiedActor = {\n  authUserId: string;\n  candidateId?: string | null;\n',
              1,
          )
          p.write_text(text)

          p = Path('src/lib/commands/candidate-submission.ts')
          text = p.read_text()
          text = text.replace(
              'import { createServerClient } from "@/lib/supabase/server";\n',
              'import {\n  buildDurableRateLimitRules,\n  digestRateLimitPrincipal,\n} from "@/lib/security/rate-limit";\nimport { createServerClient } from "@/lib/supabase/server";\n',
              1,
          )
          text = text.replace(
              '  client?: SupabaseClient;\n  resolveActor?: (client?: SupabaseClient) => Promise<VerifiedActor | null>;\n',
              '  client?: SupabaseClient;\n  actorClient?: SupabaseClient;\n  trustedIp?: string;\n  resolveActor?: (client?: SupabaseClient) => Promise<VerifiedActor | null>;\n',
              1,
          )
          text = text.replace(
              '    authUserId: user.id,\n    email: user.email,\n',
              '    authUserId: user.id,\n    candidateId: candidate.candidate_id,\n    email: user.email,\n',
              1,
          )
          text = text.replace(
              'export function createSubmitCandidateSubmissionCommand(\n  supabase: SupabaseClient,\n): TrustedCommandDefinition<',
              'export function createSubmitCandidateSubmissionCommand(\n  supabase: SupabaseClient,\n  trustedIp?: string,\n): TrustedCommandDefinition<',
              1,
          )
          text = text.replace(
              'export function createUpdateCandidateSubmissionCommand(\n  supabase: SupabaseClient,\n): TrustedCommandDefinition<',
              'export function createUpdateCandidateSubmissionCommand(\n  supabase: SupabaseClient,\n  trustedIp?: string,\n): TrustedCommandDefinition<',
              1,
          )

          old_submit = '''    async execute(_actor, validated) {\n      const { education } = formatChildArrays(validated);\n\n      const { data, error } = await supabase.rpc(\n        "submit_candidate_submission",\n        {\n          p_candidate_form_session_id: validated.candidateFormSessionId,\n          p_full_name: validated.fullName.trim(),\n          p_phone: validated.phone.trim(),\n          p_date_of_birth: validated.dateOfBirth.trim(),\n          p_gender: validated.gender.toUpperCase().trim(),\n          p_address: validated.address.trim(),\n          p_education: education,\n          p_privacy_notice_version: validated.privacyNoticeVersion.trim(),\n          p_idempotency_key: validated.idempotencyKey ?? crypto.randomUUID(),\n        },\n      );\n'''
          new_submit = '''    async execute(actor, validated) {\n      const { education } = formatChildArrays(validated);\n      if (!actor.candidateId || !trustedIp) {\n        return {\n          success: false,\n          error: {\n            code: CommandErrorCode.RATE_LIMIT_UNAVAILABLE,\n            message: "Request protection context is unavailable",\n          },\n        };\n      }\n      const rules = buildDurableRateLimitRules("CANDIDATE_SUBMIT", {\n        candidateId: actor.candidateId,\n        trustedIp,\n      });\n      const candidateKeyDigest = rules.find(\n        (rule) => rule.ruleCode === "CANDIDATE_1H",\n      )?.keyDigest;\n      if (!candidateKeyDigest) {\n        return {\n          success: false,\n          error: {\n            code: CommandErrorCode.RATE_LIMIT_UNAVAILABLE,\n            message: "Request protection context is unavailable",\n          },\n        };\n      }\n\n      const { data, error } = await supabase.rpc(\n        "submit_candidate_submission_rate_limited",\n        {\n          p_actor_auth_user_id: actor.authUserId,\n          p_candidate_key_digest: candidateKeyDigest,\n          p_trusted_ip_key_digest: digestRateLimitPrincipal(\n            "TRUSTED_IP",\n            trustedIp,\n          ),\n          p_candidate_form_session_id: validated.candidateFormSessionId,\n          p_full_name: validated.fullName.trim(),\n          p_phone: validated.phone.trim(),\n          p_date_of_birth: validated.dateOfBirth.trim(),\n          p_gender: validated.gender.toUpperCase().trim(),\n          p_address: validated.address.trim(),\n          p_education: education,\n          p_privacy_notice_version: validated.privacyNoticeVersion.trim(),\n          p_idempotency_key: validated.idempotencyKey ?? crypto.randomUUID(),\n        },\n      );\n'''
          assert text.count(old_submit) == 1
          text = text.replace(old_submit, new_submit, 1)

          old_update = '''    async execute(_actor, validated) {\n      const { education } = formatChildArrays(validated);\n\n      const { data, error } = await supabase.rpc(\n        "update_candidate_submission",\n        {\n          p_candidate_form_session_id: validated.candidateFormSessionId,\n          p_full_name: validated.fullName.trim(),\n          p_phone: validated.phone.trim(),\n          p_date_of_birth: validated.dateOfBirth.trim(),\n          p_gender: validated.gender.toUpperCase().trim(),\n          p_address: validated.address.trim(),\n          p_education: education,\n          p_privacy_notice_version: validated.privacyNoticeVersion.trim(),\n          p_idempotency_key: validated.idempotencyKey ?? crypto.randomUUID(),\n        },\n      );\n'''
          new_update = '''    async execute(actor, validated) {\n      const { education } = formatChildArrays(validated);\n      if (!actor.candidateId || !trustedIp) {\n        return {\n          success: false,\n          error: {\n            code: CommandErrorCode.RATE_LIMIT_UNAVAILABLE,\n            message: "Request protection context is unavailable",\n          },\n        };\n      }\n      const candidateIpKeyDigest = buildDurableRateLimitRules(\n        "CANDIDATE_UPDATE",\n        { candidateId: actor.candidateId, trustedIp },\n      )[0]?.keyDigest;\n      if (!candidateIpKeyDigest) {\n        return {\n          success: false,\n          error: {\n            code: CommandErrorCode.RATE_LIMIT_UNAVAILABLE,\n            message: "Request protection context is unavailable",\n          },\n        };\n      }\n\n      const { data, error } = await supabase.rpc(\n        "update_candidate_submission_rate_limited",\n        {\n          p_actor_auth_user_id: actor.authUserId,\n          p_candidate_ip_key_digest: candidateIpKeyDigest,\n          p_candidate_form_session_id: validated.candidateFormSessionId,\n          p_full_name: validated.fullName.trim(),\n          p_phone: validated.phone.trim(),\n          p_date_of_birth: validated.dateOfBirth.trim(),\n          p_gender: validated.gender.toUpperCase().trim(),\n          p_address: validated.address.trim(),\n          p_education: education,\n          p_privacy_notice_version: validated.privacyNoticeVersion.trim(),\n          p_idempotency_key: validated.idempotencyKey ?? crypto.randomUUID(),\n        },\n      );\n'''
          assert text.count(old_update) == 1
          text = text.replace(old_update, new_update, 1)

          old_public = '''  const supabase = deps.supabase ?? deps.client ?? (await createServerClient());\n  const resolveActor =\n    deps.resolveActor ?? (() => defaultResolveActor(supabase));\n  const runner = createCommandRunner({ resolveActor });\n  return runner(createSubmitCandidateSubmissionCommand(supabase), input);\n'''
          new_public = '''  const actorClient = deps.actorClient ?? deps.client ?? (await createServerClient());\n  const mutationClient = deps.supabase ?? deps.client ?? actorClient;\n  const resolveActor =\n    deps.resolveActor ?? (() => defaultResolveActor(actorClient));\n  const runner = createCommandRunner({ resolveActor });\n  return runner(\n    createSubmitCandidateSubmissionCommand(mutationClient, deps.trustedIp),\n    input,\n  );\n'''
          assert text.count(old_public) == 1
          text = text.replace(old_public, new_public, 1)

          old_public = '''  const supabase = deps.supabase ?? deps.client ?? (await createServerClient());\n  const resolveActor =\n    deps.resolveActor ?? (() => defaultResolveActor(supabase));\n  const runner = createCommandRunner({ resolveActor });\n  return runner(createUpdateCandidateSubmissionCommand(supabase), input);\n'''
          new_public = '''  const actorClient = deps.actorClient ?? deps.client ?? (await createServerClient());\n  const mutationClient = deps.supabase ?? deps.client ?? actorClient;\n  const resolveActor =\n    deps.resolveActor ?? (() => defaultResolveActor(actorClient));\n  const runner = createCommandRunner({ resolveActor });\n  return runner(\n    createUpdateCandidateSubmissionCommand(mutationClient, deps.trustedIp),\n    input,\n  );\n'''
          assert text.count(old_public) == 1
          text = text.replace(old_public, new_public, 1)
          p.write_text(text)

          p = Path('src/app/candidate/candidate-actions.ts')
          text = p.read_text()
          text = text.replace(
              '"use server";\n\n',
              '"use server";\n\nimport { headers } from "next/headers";\n',
              1,
          )
          text = text.replace(
              'import { createAdminClient } from "@/lib/supabase/admin";\n',
              'import { resolveTrustedClientIpFromHeaders } from "@/lib/security/trusted-client-ip";\nimport { createAdminClient } from "@/lib/supabase/admin";\n',
              1,
          )
          old_submit_action = '''  const supabase = await createServerClient();\n  const res = await submitCandidateSubmission(input, { supabase });\n'''
          new_submit_action = '''  const supabase = await createServerClient();\n  const trustedIp = resolveTrustedClientIpFromHeaders(await headers());\n  const admin = createAdminClient();\n  if (!trustedIp || !admin) {\n    return {\n      success: false,\n      error: "Request protection is temporarily unavailable",\n      code: "RATE_LIMIT_UNAVAILABLE",\n    };\n  }\n  const res = await submitCandidateSubmission(input, {\n    supabase: admin,\n    actorClient: supabase,\n    trustedIp,\n  });\n'''
          assert text.count(old_submit_action) == 1
          text = text.replace(old_submit_action, new_submit_action, 1)
          old_update_action = '''  const supabase = await createServerClient();\n  const res = await updateCandidateSubmission(input, { supabase });\n'''
          new_update_action = '''  const supabase = await createServerClient();\n  const trustedIp = resolveTrustedClientIpFromHeaders(await headers());\n  const admin = createAdminClient();\n  if (!trustedIp || !admin) {\n    return {\n      success: false,\n      error: "Request protection is temporarily unavailable",\n      code: "RATE_LIMIT_UNAVAILABLE",\n    };\n  }\n  const res = await updateCandidateSubmission(input, {\n    supabase: admin,\n    actorClient: supabase,\n    trustedIp,\n  });\n'''
          assert text.count(old_update_action) == 1
          text = text.replace(old_update_action, new_update_action, 1)
          p.write_text(text)
          PY

          cat > src/__tests__/candidate-mutation-rate-limit.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import test from "node:test";
          import type { SupabaseClient } from "@supabase/supabase-js";
          import {
            createSubmitCandidateSubmissionCommand,
            createUpdateCandidateSubmissionCommand,
            type SubmitCandidateSubmissionInput,
          } from "@/lib/commands/candidate-submission";
          import { CommandErrorCode, type VerifiedActor } from "@/lib/commands/types";

          const actor: VerifiedActor = {
            authUserId: "00000000-0000-0000-0000-000000008010",
            candidateId: "00000000-0000-0000-0000-000000008011",
            email: "candidate@example.test",
            isActive: true,
            roles: ["candidate"],
            permissions: ["candidate_self"],
          };

          const input: SubmitCandidateSubmissionInput = {
            candidateFormSessionId: "00000000-0000-0000-0000-000000008012",
            fullName: "Candidate Rate Limited",
            phone: "0901234567",
            dateOfBirth: "1995-05-15",
            gender: "FEMALE",
            address: "Binh Duong",
            privacyNoticeVersion: "v1",
            education: [],
            idempotencyKey: "00000000-0000-0000-0000-000000008013",
          };

          function mockRpcClient(expectedName: string) {
            let captured: Record<string, unknown> | undefined;
            const client = {
              rpc: async (name: string, args: Record<string, unknown>) => {
                assert.equal(name, expectedName);
                captured = args;
                return {
                  data: {
                    success: true,
                    data: {
                      submission_id: "00000000-0000-0000-0000-000000008014",
                      status_code: "NEW",
                      version_no: 1,
                    },
                  },
                  error: null,
                };
              },
            } as unknown as SupabaseClient;
            return { client, getCaptured: () => captured };
          }

          test("Candidate Submit uses only the service-only rate-limited wrapper", async () => {
            const mock = mockRpcClient("submit_candidate_submission_rate_limited");
            const command = createSubmitCandidateSubmissionCommand(
              mock.client,
              "203.0.113.80",
            );
            const result = await command.execute(actor, input);
            assert.equal((result as { success: boolean }).success, true);
            const args = mock.getCaptured();
            assert.equal(args?.p_actor_auth_user_id, actor.authUserId);
            assert.match(String(args?.p_candidate_key_digest), /^[0-9a-f]{64}$/);
            assert.match(String(args?.p_trusted_ip_key_digest), /^[0-9a-f]{64}$/);
            const serialized = JSON.stringify(args);
            assert.equal(serialized.includes("203.0.113.80"), false);
            assert.equal(serialized.includes("windowSeconds"), false);
            assert.equal(serialized.includes('"limit"'), false);
          });

          test("Candidate Update binds candidate+trusted-IP digest to wrapper", async () => {
            const first = mockRpcClient("update_candidate_submission_rate_limited");
            const second = mockRpcClient("update_candidate_submission_rate_limited");
            await createUpdateCandidateSubmissionCommand(
              first.client,
              "203.0.113.81",
            ).execute(actor, input);
            await createUpdateCandidateSubmissionCommand(
              second.client,
              "203.0.113.82",
            ).execute(actor, input);
            assert.match(
              String(first.getCaptured()?.p_candidate_ip_key_digest),
              /^[0-9a-f]{64}$/,
            );
            assert.notEqual(
              first.getCaptured()?.p_candidate_ip_key_digest,
              second.getCaptured()?.p_candidate_ip_key_digest,
            );
          });

          test("Candidate mutation fails closed before RPC without trusted IP", async () => {
            let calls = 0;
            const client = {
              rpc: async () => {
                calls += 1;
                return { data: null, error: null };
              },
            } as unknown as SupabaseClient;
            const result = await createSubmitCandidateSubmissionCommand(client).execute(
              actor,
              input,
            );
            assert.equal(calls, 0);
            assert.equal((result as any).success, false);
            assert.equal(
              (result as any).error.code,
              CommandErrorCode.RATE_LIMIT_UNAVAILABLE,
            );
          });

          test("Candidate Server Actions derive trusted IP and use admin wrapper client", () => {
            const source = fs.readFileSync(
              path.join(process.cwd(), "src/app/candidate/candidate-actions.ts"),
              "utf8",
            );
            assert.match(source, /resolveTrustedClientIpFromHeaders\(await headers\(\)\)/);
            assert.match(source, /createAdminClient\(\)/);
            assert.match(source, /actorClient: supabase/);
            assert.match(source, /trustedIp/);
          });
          EOF

      - name: Install dependencies
        run: |
          test "$(npm --version)" = "11.19.0"
          npm ci

      - name: Format touched Web files
        run: |
          npx biome check --write \
            src/lib/commands/types.ts \
            src/lib/commands/candidate-submission.ts \
            src/app/candidate/candidate-actions.ts \
            src/__tests__/candidate-mutation-rate-limit.test.ts

      - name: Focused Web tests
        run: |
          node --conditions react-server --test --import tsx \
            src/__tests__/rate-limit-foundation.test.ts \
            src/__tests__/candidate-mutation-rate-limit.test.ts \
            src/__tests__/candidate-portal.test.ts

      - name: Web lint and full typecheck
        run: |
          npx biome check \
            src/lib/commands/types.ts \
            src/lib/commands/candidate-submission.ts \
            src/app/candidate/candidate-actions.ts \
            src/__tests__/candidate-mutation-rate-limit.test.ts
          npm run typecheck

      - name: Commit Web materialization
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/s08-002-candidate-mutation-helper.yml
          git add web .github/workflows/s08-002-candidate-mutation-helper.yml
          git diff --cached --check
          git commit -m 'feat(s08-002): wire candidate mutation limiter wrappers'
          git push origin HEAD:work/S08-002-candidate-mutation-v1

  db:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0
      - name: Start disposable local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: supabase db reset
      - name: Foundation regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/durable_rate_limit_foundation_test.sql
      - name: Candidate wrapper regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/candidate_submission_rate_limit_wrappers_test.sql
      - name: Database lint
        run: supabase db lint --local --level warning
      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
