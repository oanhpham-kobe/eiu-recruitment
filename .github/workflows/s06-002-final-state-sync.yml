              owner_transport_evidence_branch: review/S06-002-IMPL-63f6feb-v5
              owner_transport_evidence_commit: "5d0d1cb4a54b2a13b94bae24523a775a60a8851c"
              owner_transport_evidence_path: project_control/reviews/S06_002_IMPLEMENTATION_REVIEW_63f6feb_v5.md
            integration_serialization:
