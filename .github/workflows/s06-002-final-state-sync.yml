          grep -q '63f6feba352852af5826dd582d1c42159edd66d6' project_control/AUTONOMY_RUN_STATE.yaml
          grep -q '80146bc5aab88f755312c7ffff6007c1099d6782' project_control/AUTONOMY_RUN_STATE.yaml
          grep -q 'FINAL INTEGRATION-EQUIVALENCE GATE' project_control/CURRENT_STATE.md

