name: S06-002 Final Equivalence State Sync

on:
  push:
    branches:
      - control/S06-002-final-state-sync-80146bc

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: autonomy/continuous-integration-20260905-01
          fetch-depth: 0

      - name: Verify expected integration head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "80146bc5aab88f755312c7ffff6007c1099d6782"

      - name: Patch governance state only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
