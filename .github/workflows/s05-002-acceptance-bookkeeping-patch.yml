name: S05-002 Acceptance Bookkeeping Patch

on:
  push:
    branches:
      - control/S05-002-acceptance-bookkeeping

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Patch files
        run: python .github/scripts/s05_002_acceptance_patch.py
      - name: Validate YAML
        run: |
          python - <<'PY'
          import yaml
          for path in [
              'project_control/AUTONOMY_RUN_STATE.yaml',
              'project_control/TASK_REGISTRY.yaml',
              'project_control/EVIDENCE_INDEX.yaml',
              'project_control/SLICE_REGISTRY.yaml',
          ]:
              with open(path, encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('PARSE PASS', path)
          PY
      - name: Commit bookkeeping
        run: |
          if git diff --quiet -- project_control; then
            echo 'No bookkeeping changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_control/AUTONOMY_RUN_STATE.yaml project_control/TASK_REGISTRY.yaml project_control/EVIDENCE_INDEX.yaml project_control/TRACEABILITY_STATUS.csv project_control/CURRENT_STATE.md
          git diff --cached --check
          git commit -m "chore(state): materialize S05-002 acceptance bookkeeping"
          git push origin HEAD
