name: S06-001 Prompt R2 Gate Patch

on:
  push:
    branches:
      - control/S06-001-prompt-r2-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'materialize S06-001 prompt R2 gate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Patch R2 review state
        run: python project_control/tmp_s06_prompt_r2_gate.py
      - name: Validate YAML and exact target references
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in [
              'project_control/AUTONOMY_RUN_STATE.yaml',
              'project_control/TASK_REGISTRY.yaml',
              'project_control/EVIDENCE_INDEX.yaml',
          ]:
              with open(path, encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('YAML OK:', path)
          target = '68d96b39e309ee6f1edbe6cf4031c10a583b0269'
          for path in [
              'project_control/AUTONOMY_RUN_STATE.yaml',
              'project_control/TASK_REGISTRY.yaml',
              'project_control/EVIDENCE_INDEX.yaml',
              'project_control/CURRENT_STATE.md',
              'project_control/reviews/S06_001_PROMPT_R2_REVIEW_GATE_68d96b3_v1.md',
          ]:
              assert target in Path(path).read_text(), path
          print('R2 TARGET REFERENCES: PASS')
          PY
          git diff --check
      - name: Commit R2 gate state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_control/AUTONOMY_RUN_STATE.yaml project_control/TASK_REGISTRY.yaml project_control/EVIDENCE_INDEX.yaml project_control/CURRENT_STATE.md
          git commit -m 'chore(state): materialize S06-001 prompt R2 gate'
          git push origin HEAD:control/S06-001-prompt-r2-gate
