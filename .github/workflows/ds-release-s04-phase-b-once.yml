name: DS Release S04 Phase B Once

on:
  push:
    branches:
      - oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001

permissions:
  contents: write

concurrency:
  group: ds-release-s04-phase-b-once
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply Phase-B release
        run: python project_control/tools/ds_release_s04_phase_b.py
      - name: Validate OMP-native integration
        run: python project_control/validate_omp_native.py
      - name: Validate durable control plane
        run: python project_control/validate_control_plane.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit Phase-B release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_control/TASK_REGISTRY.yaml project_control/SLICE_REGISTRY.yaml project_control/AUTONOMY_RUN_STATE.yaml project_control/EVIDENCE_INDEX.yaml project_control/CURRENT_STATE.md project_control/CHANGELOG_IMPLEMENTATION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(ds): release S04-004 after production-ready checkpoint"
          git push origin HEAD:oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001
