name: S04-004 task closure script once

on:
  push:
    branches:
      - governance/s04-closure-001

permissions:
  contents: write

concurrency:
  group: s04-task-closure-script-once
  cancel-in-progress: false

jobs:
  close-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 8

      - name: Verify accepted base is ancestor
        run: git merge-base --is-ancestor 7fa6f5805d4c17c0d92889a3786ae03a577a5ae8 HEAD

      - name: Apply task closure
        run: python project_control/tools/s04_task_closure_once.py

      - name: Validate OMP-native governance
        run: python project_control/validate_omp_native.py

      - name: Validate control plane
        run: python project_control/validate_control_plane.py

      - name: Diff hygiene
        run: git diff --check

      - name: Commit clean closure state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/s04-task-closure-once.yml
          rm -f .github/workflows/s04-task-closure-repair-once.yml
          rm -f .github/workflows/s04-task-closure-script-once.yml
          rm -f project_control/tools/s04_task_closure_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(governance): accept S04-004 and arm slice close"
          git push origin HEAD:governance/s04-closure-001
