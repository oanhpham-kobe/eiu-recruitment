name: S04 Candidate Focused Once

on:
  push:
    branches:
      - oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2

permissions:
  contents: write

concurrency:
  group: s04-candidate-focused-once
  cancel-in-progress: false

jobs:
  focused:
    if: contains(github.event.head_commit.message, 'stage S04 focused runner')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Apply known pre-verification fixes
        run: python project_control/tools/s04_candidate_fix.py
      - name: Apply focused lint repairs
        run: python project_control/tools/s04_lint_fix.py
      - name: Format changed S04 scope
        working-directory: web
        run: >-
          npx biome check --write
          src/app/interviews
          src/components/interview
          src/components/shell/AppShell.tsx
          src/components/shell/MobileNavigation.tsx
          src/components/shell/Sidebar.tsx
          src/app/layout.tsx
          src/lib/interview
          src/lib/commands/interview-lifecycle.ts
          src/styles/interview.css
          src/__tests__/interview-model.test.ts
          src/__tests__/interview-commands.test.ts
      - name: Design contract
        working-directory: web
        run: npm run design:check
      - name: Focused Interview tests
        working-directory: web
        run: node --conditions react-server --test --import tsx src/__tests__/interview-model.test.ts src/__tests__/interview-commands.test.ts
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/app/interviews web/src/components/interview web/src/components/shell/AppShell.tsx web/src/components/shell/MobileNavigation.tsx web/src/components/shell/Sidebar.tsx web/src/app/layout.tsx web/src/lib/interview web/src/lib/commands/interview-lifecycle.ts web/src/styles/interview.css web/src/__tests__/interview-model.test.ts web/src/__tests__/interview-commands.test.ts
          if git diff --cached --quiet; then
            echo "No S04 repairs to commit"
            exit 0
          fi
          git commit -m "fix(s04): harden interview scheduling candidate"
          git push origin HEAD:oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
