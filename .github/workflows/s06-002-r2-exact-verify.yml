name: S06-002 R2 Exact Verify

on:
  push:
    branches:
      - control/S06-002-r2-verify-2ff81f8

permissions:
  contents: read

jobs:
  static:
    name: Exact candidate static and gate checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4.2.2
        with:
          ref: 2ff81f8df58fd72698a9b4125a4abceef3362a44
          fetch-depth: 0
      - name: Verify exact SHA, review artifacts, patch hygiene and consumer migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2ff81f8df58fd72698a9b4125a4abceef3362a44'
          git diff --check 0a2ccdfedc477f9766c9aaa03739d16a7ed83c01...HEAD
          test -f project_control/reviews/S06_002_IMPLEMENTATION_REVIEW_GATE_a7aa037_v1.md
          test -f project_control/reviews/S06_002_IMPLEMENTATION_REVIEW_OWNER_TRANSPORT_a7aa037_v1.md
          test -f project_control/reviews/S06_002_IMPLEMENTATION_R2_GATE_v1.md
          test "$(git diff --name-only a7aa037e26cda6ba70153539c1dfc15c3fba37e6...HEAD | grep '^supabase/migrations/.*_internal_user_r2_review_repairs.sql$' | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          import re
          paths = [
              'web/src/lib/application-inbox/server.ts',
              'web/src/lib/application-inbox/submission-detail-server.ts',
              'web/src/lib/commands/application-lifecycle.ts',
              'web/src/lib/commands/candidate-lifecycle.ts',
              'web/src/lib/commands/submission-status.ts',
              'web/src/lib/interview/server.ts',
              'web/src/lib/auth/session.ts',
          ]
          pattern = re.compile(r'\.from\(["\']app_users["\']\)(?:(?!\.from\().){0,500}?\.eq\(["\']auth_user_id["\']', re.S)
          bad = [p for p in paths if pattern.search(Path(p).read_text(encoding='utf-8'))]
          if bad:
              raise SystemExit('raw app_users auth_user_id consumers remain: ' + ', '.join(bad))
          migration = next(Path('supabase/migrations').glob('*_internal_user_r2_review_repairs.sql'))
          text = migration.read_text(encoding='utf-8')
          required = [
              'get_current_internal_binding_status',
              "for update;",
              "internal-email:",
              'CURRENT_PARTICIPANT_INACTIVE_REASSIGN_REQUIRED',
              "schedule_status_code <> 'CANCELLED'",
              "set search_path = ''",
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('missing R2 migration markers: ' + repr(missing))
          PY

  web:
    name: Exact candidate web verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4.2.2
        with:
          ref: 2ff81f8df58fd72698a9b4125a4abceef3362a44
      - name: Verify exact SHA
        working-directory: .
        run: test "$(git rev-parse HEAD)" = '2ff81f8df58fd72698a9b4125a4abceef3362a44'
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ensure npm 11.19.0
        run: |
          if [ "$(npm --version)" != "11.19.0" ]; then npm install --global npm@11.19.0; fi
          test "$(npm --version)" = '11.19.0'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Validate production design contract
        run: npm run design:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full web acceptance suite
        run: npm run test

  db:
    name: Exact candidate database and concurrency verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4.2.2
        with:
          ref: 2ff81f8df58fd72698a9b4125a4abceef3362a44
          fetch-depth: 0
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = '2ff81f8df58fd72698a9b4125a4abceef3362a44'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: supabase db reset
      - name: TASK-S06-002 focused Internal User/RBAC/Identity regressions including R2 dormant-history repair
        run: bash supabase/tests/internal_user_rbac_identity_test.sh
      - name: TASK-S06-002 lifecycle and public-command lock-order concurrency regressions
        run: bash supabase/tests/internal_user_lifecycle_concurrency_test.sh
      - name: Crossed Application reactivation and participant contract regressions
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/application_reactivation_and_participant_contract_repair_test.sql
      - name: Crossed Interview lifecycle regressions
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/interview_lifecycle_test.sql
      - name: Crossed Interview round/conflict regressions
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/interview_round_and_conflict_locking_test.sql
      - name: Crossed Interview copy regressions
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/copy_interview_schedule_test.sql
      - name: Crossed bulk Application assignment regressions
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/bulk_commands_replay.sql
      - name: TASK-S06-001 canonical seed and guard regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/master_data_seed_guard_test.sql
      - name: TASK-S06-001 lifecycle/history regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/master_data_lifecycle_history_test.sql
      - name: TASK-S06-001 durable reference history regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/master_data_durable_reference_history_test.sql
      - name: Database lint at error level
        run: supabase db lint --local --level error
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
