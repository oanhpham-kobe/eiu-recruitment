name: S08-002 Materialization Helper

on:
  push:
    branches:
      - automation/s08-002-materialize-helper-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch governed S08-002 materialization state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          # TASK_REGISTRY: make S08-002 the governed current task and append one task node.
          task_path = 'project_control/TASK_REGISTRY.yaml'
          task = read(task_path)
          task = replace_once(
              task,
              'current_task: TASK-S08-001\n',
              'current_task: TASK-S08-002\n',
              'TASK_REGISTRY current_task',
          )
          if '  TASK-S08-002:\n' in task:
              raise SystemExit('TASK-S08-002 already exists in TASK_REGISTRY')
          if not task.endswith('\n'):
              task += '\n'
          task += '''\n  TASK-S08-002:\n    title: "Durable Distributed Rate Limiting and Abuse Controls"\n    slice: SLICE-08\n    status: PLANNED\n    lane: LANE_A\n    depends_on: [TASK-S08-001, TASK-S01-005, TASK-S02-003, TASK-S02-004, TASK-S04-002, TASK-S07-005]\n    planning_baseline_sha: "8dcb0a5d7ce1be9d82e3448c01cdc1643e3ac8c4"\n    source_reconciliation: project_control/reviews/S08_002_SOURCE_RECONCILIATION_v1.md\n    source_reconciliation_work_id: S08-002-SOURCE-RECONCILIATION-001\n    source_reconciliation_status: PASS\n    source_reopen_required: false\n    source_review_work_id: S08-002-SOURCE-REVIEW-001\n    source_review_status: PASS\n    source_review_reviewed_sha: "a99375932e95805a8b52a6a159eb94a755c88986"\n    source_review_evidence_commit: "25612895c41b7164961c06d6613f8c61cf9660de"\n    source_review_artifact: project_control/reviews/S08_002_SOURCE_REVIEW_a993759_v1.md\n    task_materialization_authorized: true\n    prompt: project_control/prompts/SLICE-08_TASK-002_v1.md\n    prompt_version: v1\n    governed_pre_task_checkpoint: checkpoint/pre-S08-002-001\n    governed_pre_task_checkpoint_status: PENDING_CREATION_AFTER_MATERIALIZATION_VALIDATION\n    prompt_review_status: PENDING\n    prompt_review_work_id: S08-002-PROMPT-REVIEW-001\n    implementation_started: false\n    implementation_authorized: false\n    implementation_review_mode: OMP_EIU_REVIEWER\n    acceptance:\n      - "Canonical initial rate-limit matrix is enforced with durable shared multi-instance state and atomic concurrency-safe consumption."\n      - "Trusted client-IP resolution rejects unapproved/forged forwarding authority; rate limiting remains additive to same-origin, Auth, RLS, RBAC, validation, optimistic locking and idempotency."\n      - "OTP request/verify, Candidate Submit/Update, reachable upload boundaries, internal free-text search, and email enqueue receive the reconciled policy without reopening accepted business contracts."\n      - "Bulk email preserves PER_ITEM_ENQUEUE_RESULT semantics and per-item/entity accounting; provider delivery throttling remains distinct from enqueue limiting."\n      - "PII/OTP/token/signed-URL/file-content/raw-search data is excluded from limiter keys/logs/audit beyond the minimum policy dimensions required for enforcement."\n      - "PDF policy remains reusable/deferred until a real PDF-generation endpoint exists; no synthetic PDF feature is introduced."\n      - "Disposable/local replay, focused rate-limit concurrency/expiry/forged-header tests, predecessor regressions, Web gates, DB lint, and governance validators are required before acceptance."\n    out_of_scope: "Provider runtime redesign, PDF product implementation, production deployment, Vercel environment mutation, connected/hosted Supabase mutation, production secrets, main mutation, accepted checkpoint movement, and unrelated business/search redesign."\n    next_frontier_behavior: "Independent prompt/source review only. Implementation remains forbidden until exact-SHA prompt review PASS is transported/persisted and a later explicit Owner implementation dispatch authorizes producer execution."\n'''
          write(task_path, task)

          # SLICE_REGISTRY: point Slice-08 at the newly materialized task.
          slice_path = 'project_control/SLICE_REGISTRY.yaml'
          slices = read(slice_path)
          slices = replace_once(
              slices,
              'SLICE-08: {name: Search / Performance / Ops / Release Hardening, status: IN_PROGRESS, current_task: TASK-S08-001}',
              'SLICE-08: {name: Search / Performance / Ops / Release Hardening, status: IN_PROGRESS, current_task: TASK-S08-002}',
              'SLICE_REGISTRY Slice-08 current_task',
          )
          write(slice_path, slices)

          # AUTONOMY_RUN_STATE: replace only the Slice-08 tail/state frontier.
          run_path = 'project_control/AUTONOMY_RUN_STATE.yaml'
          run = read(run_path)
          marker = 'slice_08_planning:\n'
          if run.count(marker) != 1:
              raise SystemExit(f'AUTONOMY_RUN_STATE: expected one slice_08_planning marker, got {run.count(marker)}')
          prefix = run.split(marker, 1)[0]
          run_tail = '''slice_08_planning:\n  status: S08_002_MATERIALIZED_AWAITING_INDEPENDENT_PROMPT_REVIEW\n  lifecycle: ACTIVE\n  selected_task: TASK-S08-002\n  predecessor_task: TASK-S08-001\n  predecessor_accepted_checkpoint: checkpoint/S08-001-accepted-001\n  predecessor_accepted_sha: "0d8c5c2129ed4c78a58c8d37bd22e93c14a763eb"\n  source_reconciliation: project_control/reviews/S08_002_SOURCE_RECONCILIATION_v1.md\n  source_reconciliation_work_id: S08-002-SOURCE-RECONCILIATION-001\n  source_reconciliation_status: PASS\n  source_reopen_required: false\n  independent_source_review:\n    work_id: S08-002-SOURCE-REVIEW-001\n    reviewer: OMP_EIU_REVIEWER\n    reviewed_sha: "a99375932e95805a8b52a6a159eb94a755c88986"\n    verdict: PASS\n    source_reopen_required: false\n    task_materialization_authorized: true\n    implementation_authorized: false\n    evidence_commit: "25612895c41b7164961c06d6613f8c61cf9660de"\n    evidence_path: project_control/reviews/S08_002_SOURCE_REVIEW_a993759_v1.md\n  prompt: project_control/prompts/SLICE-08_TASK-002_v1.md\n  prompt_version: v1\n  governed_pre_task_checkpoint: checkpoint/pre-S08-002-001\n  governed_pre_task_checkpoint_status: PENDING_CREATION_AFTER_MATERIALIZATION_VALIDATION\n  prompt_review_status: PENDING\n  prompt_review_work_id: S08-002-PROMPT-REVIEW-001\n  implementation_started: false\n  implementation_authorized: false\n  producer_role: EXTERNAL_CHATGPT\n  independent_prompt_reviewer: OMP_EIU_REVIEWER\n  materialized_next_task_count: 2\n\nsafe_frontier:\n  eligible_tasks: []\n  skipped_due_to_dependency:\n    - "TASK-S08-002 is materialized but implementation is held pending exact-SHA independent prompt/source review and later explicit Owner implementation dispatch."\n  materialization_frontier: []\n  execution_hold: "PROMPT REVIEW HARD STOP for TASK-S08-002. Do not start implementation, mutate main, deploy Vercel, or mutate connected/hosted Supabase."\n\nstop_gate:\n  status: ACTIVE\n  type: S08_002_INDEPENDENT_PROMPT_REVIEW_GATE\n  source_reopen_required: false\n  resume_on: "Independent OMP prompt/source review of checkpoint/pre-S08-002-001 returns PASS with SOURCE_REOPEN_REQUIRED=false, followed by Owner-transported persistence. Implementation still requires a separate explicit Owner dispatch."\n\nnext_action: "SAFE CHECKPOINT: create and verify immutable checkpoint/pre-S08-002-001 after this materialization validates, then stop for independent OMP prompt/source review. Implementation remains unauthorized."\n'''
          write(run_path, prefix + run_tail)

          # EVIDENCE_INDEX: retain S08-001 history and add the S08-002 planning gate.
          evidence_path = 'project_control/EVIDENCE_INDEX.yaml'
          evidence = read(evidence_path)
          evidence = replace_once(
              evidence,
              '  status: S08_001_ACCEPTED_HARD_STOP_BEFORE_S08_002_MATERIALIZATION\n  note: "TASK-S08-001 is accepted at immutable checkpoint/S08-001-accepted-001 -> 0d8c5c2129ed4c78a58c8d37bd22e93c14a763eb after independent final acceptance PASS. TASK-S08-002 remains not materialized and is not authorized by this acceptance."\n',
              '  status: S08_002_MATERIALIZED_AWAITING_INDEPENDENT_PROMPT_REVIEW\n  note: "TASK-S08-002 is now materialized for prompt review only after independent source-reconciliation PASS. Implementation remains unauthorized; checkpoint/pre-S08-002-001 must be created and independently reviewed before any implementation dispatch."\n',
              'EVIDENCE_INDEX status/note',
          )
          insert_marker = '  S08-001-SOURCE-GATE-001:\n'
          if evidence.count(insert_marker) != 1:
              raise SystemExit(f'EVIDENCE_INDEX: expected one S08-001 gate marker, got {evidence.count(insert_marker)}')
          gate = '''  S08-002-SOURCE-GATE-001:\n    task: TASK-S08-002\n    operation: DURABLE_DISTRIBUTED_RATE_LIMITING_AND_ABUSE_CONTROLS\n    status: MATERIALIZED_AWAITING_PROMPT_REVIEW\n    source_reconciliation: project_control/reviews/S08_002_SOURCE_RECONCILIATION_v1.md\n    source_reconciliation_work_id: S08-002-SOURCE-RECONCILIATION-001\n    source_reconciliation_reviewed_sha: "a99375932e95805a8b52a6a159eb94a755c88986"\n    source_review_work_id: S08-002-SOURCE-REVIEW-001\n    source_review_reviewer: OMP_EIU_REVIEWER\n    source_review_result: PASS\n    source_reopen_required: false\n    task_materialization_authorized: true\n    source_review_evidence_commit: "25612895c41b7164961c06d6613f8c61cf9660de"\n    source_review_evidence_path: project_control/reviews/S08_002_SOURCE_REVIEW_a993759_v1.md\n    prompt: project_control/prompts/SLICE-08_TASK-002_v1.md\n    prompt_version: v1\n    governed_pre_task_checkpoint: checkpoint/pre-S08-002-001\n    governed_pre_task_checkpoint_status: PENDING_CREATION_AFTER_MATERIALIZATION_VALIDATION\n    prompt_review_status: PENDING\n    implementation_started: false\n    implementation_authorized: false\n    bounded_scope: "Durable shared rate limiting for canonical OTP, Candidate mutation, reachable upload, internal search and email-enqueue boundaries; PDF policy reusable/deferred until a real PDF endpoint exists."\n\n'''
          evidence = evidence.replace(insert_marker, gate + insert_marker, 1)
          write(evidence_path, evidence)

          # CURRENT_STATE is derived/non-authoritative, but keep it synchronized in the same atomic tree.
          current_path = 'project_control/CURRENT_STATE.md'
          current = read(current_path)
          marker = '## Slice-08 frontier\n'
          if current.count(marker) != 1:
              raise SystemExit(f'CURRENT_STATE: expected one Slice-08 frontier marker, got {current.count(marker)}')
          prefix = current.split(marker, 1)[0]
          current_tail = '''## TASK-S08-002 prompt gate\n\n- `TASK-S08-002 — Durable Distributed Rate Limiting and Abuse Controls` is now materialized in the governed DAG for prompt review only.\n- Producer source reconciliation `S08-002-SOURCE-RECONCILIATION-001`: PASS; source reopen false.\n- Independent source review `S08-002-SOURCE-REVIEW-001` by `OMP_EIU_REVIEWER`: PASS on exact `a99375932e95805a8b52a6a159eb94a755c88986`; task materialization authorized; implementation not authorized.\n- Durable Owner-transported review evidence: `project_control/reviews/S08_002_SOURCE_REVIEW_a993759_v1.md` at `25612895c41b7164961c06d6613f8c61cf9660de`.\n- Governed prompt draft: `project_control/prompts/SLICE-08_TASK-002_v1.md`.\n- Intended immutable pre-task checkpoint: `checkpoint/pre-S08-002-001`; create only after materialization validators/diff pass.\n- Prompt review status: PENDING. Implementation started: false. Implementation authorized: false.\n\n## Slice-08 frontier\n\n- Slice-08 remains `IN_PROGRESS`; current governed task is `TASK-S08-002`.\n- Safe frontier for implementation is empty while the independent prompt/source review gate is active.\n- Next allowed action is creation/verification of `checkpoint/pre-S08-002-001`, followed by independent OMP prompt review of that exact SHA.\n- A prompt-review PASS does not itself authorize implementation; explicit Owner implementation dispatch remains required.\n\n## Scope boundary\n\nTASK-S08-001 remains immutable and accepted at `checkpoint/S08-001-accepted-001`. TASK-S08-002 is materialized for prompt review only. Do not mutate `main`, deploy Vercel, mutate connected/hosted Supabase, use production secrets, move accepted checkpoints, or begin S08-002 implementation from this materialization transition.\n'''
          write(current_path, prefix + current_tail)
          PY

      - name: Validate governed materialization
        shell: bash
        run: |
          python project_control/validate_control_plane.py
          python project_control/validate_omp_native.py
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              'project_control/AUTONOMY_RUN_STATE.yaml',
              'project_control/CURRENT_STATE.md',
              'project_control/EVIDENCE_INDEX.yaml',
              'project_control/SLICE_REGISTRY.yaml',
              'project_control/TASK_REGISTRY.yaml',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected materialization scope: {sorted(changed)}')
          print('S08-002 materialization scope PASS:', sorted(changed))
          PY

      - name: Commit final helper tree without helper workflow
        shell: bash
        run: |
          rm .github/workflows/s08-002-materialize-helper.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add project_control/AUTONOMY_RUN_STATE.yaml project_control/CURRENT_STATE.md project_control/EVIDENCE_INDEX.yaml project_control/SLICE_REGISTRY.yaml project_control/TASK_REGISTRY.yaml .github/workflows/s08-002-materialize-helper.yml
          git commit -m "chore(s08-002): prepare governed prompt review materialization"
          git push origin HEAD:automation/s08-002-materialize-helper-v1
