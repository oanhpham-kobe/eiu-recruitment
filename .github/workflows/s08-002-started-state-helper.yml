name: S08-002 Started State Helper

on:
  push:
    branches:
      - automation/s08-002-started-state-helper

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Materialize truthful implementation state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          foundation = 'a6be3552743801db7aa46e45b29917d81e315a6b'
          validation = '36035922103'

          p = Path('project_control/TASK_REGISTRY.yaml')
          text = p.read_text()
          marker = '\n  TASK-S08-002:\n'
          assert text.count(marker) == 1
          head, tail = text.split(marker, 1)
          assert tail.count('    status: PLANNED\n') >= 1
          tail = tail.replace('    status: PLANNED\n', '    status: IN_PROGRESS\n', 1)
          assert tail.count('    implementation_started: false\n') >= 1
          tail = tail.replace(
              '    implementation_started: false\n',
              '    implementation_started: true\n'
              f'    implementation_foundation_sha: "{foundation}"\n'
              f'    implementation_foundation_validation: "GitHub Actions {validation} PASS (Web focused test/lint/typecheck; clean DB replay; focused SQL regression; DB lint)"\n',
              1,
          )
          p.write_text(head + marker + tail)

          p = Path('project_control/AUTONOMY_RUN_STATE.yaml')
          text = p.read_text()
          marker = 'slice_08_planning:'
          assert text.count(marker) == 1
          prefix, tail = text.split(marker, 1)
          assert '  status: S08_002_IMPLEMENTATION_AUTHORIZED_READY\n' in tail
          tail = tail.replace(
              '  status: S08_002_IMPLEMENTATION_AUTHORIZED_READY\n',
              '  status: S08_002_IMPLEMENTATION_IN_PROGRESS\n',
              1,
          )
          assert '  implementation_started: false\n' in tail
          tail = tail.replace(
              '  implementation_started: false\n',
              '  implementation_started: true\n'
              f'  implementation_foundation_sha: "{foundation}"\n'
              f'  implementation_foundation_validation_run: "{validation}"\n',
              1,
          )
          old_next = 'next_action: "SAFE CHECKPOINT: begin TASK-S08-002 implementation on chatgpt/TASK-S08-002-durable-rate-limiting from governed baseline c3fd09b5cbe38205802b079560aff8452c6bbe3b; preserve all deployment/main/hosted-Supabase boundaries and stop at an independently reviewable candidate SHA."\n'
          new_next = 'next_action: "Continue TASK-S08-002 implementation from validated foundation a6be3552743801db7aa46e45b29917d81e315a6b on the isolated task branch; preserve deployment/main/hosted-Supabase boundaries and stop at an independently reviewable full-task candidate SHA."\n'
          assert old_next in tail
          tail = tail.replace(old_next, new_next, 1)
          p.write_text(prefix + marker + tail)

          p = Path('project_control/EVIDENCE_INDEX.yaml')
          text = p.read_text()
          assert '  status: S08_002_IMPLEMENTATION_AUTHORIZED_READY\n' in text
          text = text.replace(
              '  status: S08_002_IMPLEMENTATION_AUTHORIZED_READY\n',
              '  status: S08_002_IMPLEMENTATION_IN_PROGRESS\n',
              1,
          )
          old_note = '  note: "TASK-S08-002 prompt/source review PASS is persisted and explicit Owner implementation dispatch has been received. Implementation is authorized but has not started; execution is isolated to the task branch."\n'
          new_note = f'  note: "TASK-S08-002 implementation is in progress on the isolated task branch. Foundation {foundation} passed focused Web/DB verification in GitHub Actions run {validation}; independent full-task implementation review remains pending."\n'
          assert old_note in text
          text = text.replace(old_note, new_note, 1)
          marker = '  S08-002-SOURCE-GATE-001:\n'
          assert text.count(marker) == 1
          prefix, tail = text.split(marker, 1)
          assert '    implementation_started: false\n' in tail
          tail = tail.replace(
              '    implementation_started: false\n',
              '    implementation_started: true\n'
              f'    implementation_foundation_sha: "{foundation}"\n'
              f'    implementation_foundation_validation_run: "{validation}"\n',
              1,
          )
          p.write_text(prefix + marker + tail)

          p = Path('project_control/CURRENT_STATE.md')
          text = p.read_text()
          old = '- Explicit Owner implementation dispatch received after PASS. Implementation authorized: true. Implementation started: false.\n- Isolated implementation branch: `chatgpt/TASK-S08-002-durable-rate-limiting` from exact governed baseline `c3fd09b5cbe38205802b079560aff8452c6bbe3b`.\n\n## Slice-08 frontier\n\n- Slice-08 remains `IN_PROGRESS`; current governed task is `TASK-S08-002`.\n- TASK-S08-002 is implementation-ready on its isolated branch; no product write has started yet.\n- Next allowed action is producer implementation from the exact governed baseline, followed by producer self-audit and independent OMP implementation review before any integration serialization.\n'
          new = f'- Explicit Owner implementation dispatch received after PASS. Implementation authorized: true. Implementation started: true.\n- Isolated implementation branch: `chatgpt/TASK-S08-002-durable-rate-limiting` from exact governed baseline `c3fd09b5cbe38205802b079560aff8452c6bbe3b`.\n- Validated implementation foundation: `{foundation}`; GitHub Actions `{validation}` PASS for Web focused test/lint/typecheck and disposable DB replay/focused SQL/DB lint.\n\n## Slice-08 frontier\n\n- Slice-08 remains `IN_PROGRESS`; current governed task is `TASK-S08-002`.\n- TASK-S08-002 implementation is active on its isolated branch; foundation verification is PASS, while endpoint/business-boundary wiring and full-task review remain pending.\n- Next allowed action is continued producer implementation, followed by producer self-audit and independent OMP implementation review before any integration serialization.\n'
          assert old in text
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Validate governance state
        shell: bash
        run: |
          set -euo pipefail
          python project_control/validate_control_plane.py
          python project_control/validate_omp_native.py
          git diff --check a6be3552743801db7aa46e45b29917d81e315a6b --
          grep -F 'status: IN_PROGRESS' project_control/TASK_REGISTRY.yaml
          grep -F 'implementation_started: true' project_control/TASK_REGISTRY.yaml
          grep -F 'status: S08_002_IMPLEMENTATION_IN_PROGRESS' project_control/AUTONOMY_RUN_STATE.yaml

      - name: Commit clean state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/s08-002-started-state-helper.yml
          git add project_control .github/workflows/s08-002-started-state-helper.yml
          git diff --cached --check
          git commit -m 'chore(s08-002): mark implementation in progress'
          changed="$(git diff --name-only a6be3552743801db7aa46e45b29917d81e315a6b...HEAD | sort)"
          expected="$(printf '%s\n' \
            project_control/AUTONOMY_RUN_STATE.yaml \
            project_control/CURRENT_STATE.md \
            project_control/EVIDENCE_INDEX.yaml \
            project_control/TASK_REGISTRY.yaml | sort)"
          test "$changed" = "$expected"
          git push origin HEAD:automation/s08-002-started-state-helper
