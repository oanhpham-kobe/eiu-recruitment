name: S06-001 Prompt Review Gate Patch

on:
  push:
    branches:
      - control/S06-001-prompt-review-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'materialize S06-001 prompt review gate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Patch prompt-review state
        run: python project_control/tmp_s06_prompt_gate.py
      - name: Validate YAML
        run: |
          python - <<'PY'
          import yaml
          for path in [
              'project_control/AUTONOMY_RUN_STATE.yaml',
              'project_control/TASK_REGISTRY.yaml',
              'project_control/EVIDENCE_INDEX.yaml',
          ]:
              with open(path, encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('YAML OK:', path)
          PY
      - name: Commit prompt review state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_control/AUTONOMY_RUN_STATE.yaml project_control/TASK_REGISTRY.yaml project_control/EVIDENCE_INDEX.yaml project_control/CURRENT_STATE.md
          git commit -m 'chore(state): materialize S06-001 prompt review gate'
          git push origin HEAD:control/S06-001-prompt-review-gate
