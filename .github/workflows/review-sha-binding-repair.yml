name: One-shot Review SHA Binding Repair

on:
  push:
    branches:
      - maintenance/review-ci-handoff-protocol-001

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip-review-sha-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/review-ci-handoff-protocol-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Apply review SHA binding repair
        run: python project_control/tools/_repair_review_sha_binding.py
      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          python project_control/validate_omp_native.py
          python project_control/validate_control_plane.py
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .omp/RULES.md AGENTS.md REVIEW.md project_control/AUTONOMY_PARALLEL_GOVERNANCE.md project_control/AUTONOMY_RUN_STATE.yaml project_control/CHANGELOG_IMPLEMENTATION.md project_control/CURRENT_STATE.md
          git diff --cached --check
          git commit -m "fix: bind final review CI and checkpoint SHA [skip-review-sha-repair]"
          git push origin HEAD:maintenance/review-ci-handoff-protocol-001
