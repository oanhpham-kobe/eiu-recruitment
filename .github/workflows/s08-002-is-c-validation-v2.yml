name: S08-002 IS-C Validation v2

on:
  push:
    branches:
      - tmp/s08-002-is-c-validation-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0

      - name: Confirm internal schema is not Data API exposed
        run: grep -F 'schemas = ["public", "graphql_public"]' supabase/config.toml

      - name: Start local Supabase
        run: supabase start

      - name: Replay migrations from zero
        run: supabase db reset

      - name: Durable limiter foundation regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/durable_rate_limit_foundation_test.sql

      - name: Internal Search helper regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/internal_search_rate_limit_helper_test.sql

      - name: Accepted Application Inbox search regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/application_inbox_search_hardening_test.sql

      - name: Application Inbox rate-limit boundary regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/application_inbox_rate_limit_boundary_test.sql

      - name: Lint local database
        run: supabase db lint --local --level error

      - name: Stop local Supabase
        if: always()
        run: supabase stop
