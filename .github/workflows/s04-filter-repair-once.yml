name: S04 Canonical Filter Repair Once

on:
  push:
    branches:
      - oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
    paths:
      - .github/s04_filter_patch.py
      - .github/s04_filter_type_fix.py
      - .github/workflows/s04-filter-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply canonical filter repair
        run: |
          python .github/s04_filter_patch.py
          python .github/s04_filter_type_fix.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Format directly affected files
        working-directory: web
        run: npx biome check --write src/lib/interview/model.ts src/lib/interview/server.ts src/components/interview/InterviewPage.tsx src/__tests__/interview-model.test.ts
      - name: Capture TypeScript diagnostic
        id: typecheck
        shell: bash
        working-directory: web
        run: |
          set +e
          npm run typecheck > ../.github/s04-typecheck.log 2>&1
          code=$?
          cat ../.github/s04-typecheck.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic only when typecheck fails
        if: steps.typecheck.outputs.exit_code != '0'
        shell: bash
        run: |
          git add -f .github/s04-typecheck.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(s04): refresh filter typecheck diagnostic"
          git push origin HEAD:oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
      - name: Stop after diagnostic failure
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Production build
        if: steps.typecheck.outputs.exit_code == '0'
        working-directory: web
        run: npm run build
      - name: Commit verified repair and remove staging helpers
        if: steps.typecheck.outputs.exit_code == '0'
        shell: bash
        run: |
          rm .github/workflows/s04-filter-repair-once.yml
          rm .github/s04_filter_patch.py
          rm .github/s04_filter_type_fix.py
          rm -f .github/s04-typecheck.log
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(s04): complete canonical interview filters"
          git push origin HEAD:oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
