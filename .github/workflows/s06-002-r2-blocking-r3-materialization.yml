name: S06-002 R2 Blocking Verdict Materialization

on:
  push:
    branches:
      - control/S06-002-r2-blocking-r3-repair

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Preserve materializer and checkout exact integration control head
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:.github/scripts/s06_002_materialize_r2_blocking_r3.py > /tmp/materialize.py
          git checkout --detach 12dee17b8e9c50ad0cb91e6fc1a50a7dfe3e4894
          test "$(git rev-parse HEAD)" = '12dee17b8e9c50ad0cb91e6fc1a50a7dfe3e4894'
      - name: Materialize R2 blocking verdict and R3 repair state
        run: python /tmp/materialize.py
      - name: Validate control artifacts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ruby -e "require 'yaml'; YAML.load_file('project_control/AUTONOMY_RUN_STATE.yaml'); YAML.load_file('project_control/TASK_REGISTRY.yaml')"
          grep -F 'status: IMPLEMENTATION_REPAIR_ACTIVE' project_control/AUTONOMY_RUN_STATE.yaml
          grep -F 'review_round: R3' project_control/AUTONOMY_RUN_STATE.yaml
          grep -F 'result: BLOCKING_REPAIR' project_control/AUTONOMY_RUN_STATE.yaml
          grep -F 'status: IN_PROGRESS' project_control/TASK_REGISTRY.yaml
          grep -F 'repair_round: R3' project_control/TASK_REGISTRY.yaml
          grep -F 'implementation_candidate_sha: PENDING' project_control/TASK_REGISTRY.yaml
          test -f project_control/reviews/S06_002_IMPLEMENTATION_REVIEW_OWNER_TRANSPORT_7c37d46_v2.md
          git add project_control/AUTONOMY_RUN_STATE.yaml project_control/CURRENT_STATE.md project_control/TASK_REGISTRY.yaml project_control/reviews/S06_002_IMPLEMENTATION_REVIEW_OWNER_TRANSPORT_7c37d46_v2.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'project_control/AUTONOMY_RUN_STATE.yaml project_control/CURRENT_STATE.md project_control/TASK_REGISTRY.yaml project_control/reviews/S06_002_IMPLEMENTATION_REVIEW_OWNER_TRANSPORT_7c37d46_v2.md '
      - name: Commit and publish isolated control result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(state): activate TASK-S06-002 R3 repair'
          git push origin HEAD:refs/heads/control/S06-002-r2-blocking-r3-result
