name: S05-001 Post-CI State Patch

on:
  push:
    branches:
      - control/S05-001-post-ci-state

permissions:
  contents: write

jobs:
  patch-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4.2.2
        with:
          ref: control/S05-001-post-ci-state
          fetch-depth: 0

      - name: Detect completed state
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = "chore(state): persist S05-001 acceptance" ]; then
            echo "SKIP_PATCH=1" >> "$GITHUB_ENV"
          fi

      - name: Patch state
        if: env.SKIP_PATCH != '1'
        shell: bash
        run: |
          set -euo pipefail
          python project_control/tools/s05_001_acceptance_patch.py

      - name: Sanity check
        if: env.SKIP_PATCH != '1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^  TASK-S05-001:' project_control/TASK_REGISTRY.yaml)" = 1
          grep -q '^    status: DONE$' project_control/TASK_REGISTRY.yaml
          grep -q 'checkpoint/S05-001-accepted-001' project_control/TASK_REGISTRY.yaml
          grep -q '^  status: OWNER_REQUESTED_HANDOFF$' project_control/AUTONOMY_RUN_STATE.yaml
          grep -q '^  INTERVIEWER-REPORT-ACCEPTANCE-001:' project_control/EVIDENCE_INDEX.yaml
          git diff --check

      - name: Commit acceptance state
        if: env.SKIP_PATCH != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oanhpham-kobe"
          git config user.email "oanh.pham@eiu.edu.vn"
          git add project_control/TASK_REGISTRY.yaml project_control/AUTONOMY_RUN_STATE.yaml project_control/CURRENT_STATE.md project_control/EVIDENCE_INDEX.yaml
          git diff --cached --check
          git commit -m "chore(state): persist S05-001 acceptance"
          git push origin HEAD:control/S05-001-post-ci-state
