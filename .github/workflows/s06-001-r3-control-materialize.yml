name: S06-001 R3 Control Materialization

on:
  push:
    branches:
      - control/S06-001-R3-gate-9002c9b

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'materialize S06-001 R3 review state') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Patch bounded S06 authority
        run: python project_control/tmp_s06_r3_gate_patch.py
      - name: Validate YAML and scope
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          p = Path('project_control/AUTONOMY_RUN_STATE.yaml')
          data = yaml.safe_load(p.read_text())
          assert data['slice_06_planning']['implementation_candidate']['candidate_sha'] == '9002c9be26c57a182494b9b0de46ae612f32d81e'
          assert data['slice_06_planning']['independent_implementation_review']['work_id'] == 'S06-001-IMPLEMENTATION-REVIEW-001-R3'
          assert data['stop_gate']['work_id'] == 'S06-001-IMPLEMENTATION-REVIEW-001-R3'
          print('S06 R3 authority YAML valid')
          PY
          python project_control/validate_control_plane.py
      - name: Self-remove staging tools and commit authority
        run: |
          git rm .github/workflows/s06-001-r3-control-materialize.yml project_control/tmp_s06_r3_gate_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(state): materialize S06-001 R3 review state'
          git push origin HEAD:control/S06-001-R3-gate-9002c9b
