name: S05-002 R3 Verify

on:
  push:
    branches:
      - verify/S05-002-R3-5883680

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ensure npm 11.19.0
        run: |
          if [ "$(npm --version)" != "11.19.0" ]; then npm install --global npm@11.19.0; fi
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run design:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: supabase db reset
      - name: S05-001 contextual read regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -U postgres -d postgres < supabase/tests/interviewer_report_contextual_read_test.sql
      - name: Diagnose HR aggregate count
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('supabase/tests/hr_report_management_test.sql').read_text()
          needle = "  assert (v_result->'data'->>'total')::integer = 2,\n    'one aggregate row is returned for each Application with a Current Round';"
          diagnostic = """  raise notice 'DEBUG HR result=%', v_result;
          raise notice 'DEBUG HR current_map=%', (
            select coalesce(
              jsonb_agg(
                jsonb_build_object(
                  'application_id', ci.application_id,
                  'interview_id', ci.interview_id,
                  'round_no', ci.round_no
                )
                order by ci.application_id
              ),
              '[]'::jsonb
            )
            from private.application_current_interview ci
            where ci.application_id in (v_application_1, v_application_2)
          );
          """ + needle
          if needle not in source:
              raise SystemExit('expected HR total assertion not found')
          Path('/tmp/hr_report_management_debug.sql').write_text(source.replace(needle, diagnostic, 1))
          PY
          docker exec -i supabase_db_eiu-recruitment-dev psql -U postgres -d postgres < /tmp/hr_report_management_debug.sql
      - name: S05-002 HR management regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -U postgres -d postgres < supabase/tests/hr_report_management_test.sql
      - name: S05-002 HR DTO privacy regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -U postgres -d postgres < supabase/tests/hr_report_dto_privacy_test.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop

# verify-only diagnostics; never transplant workflow changes to task branch
