name: One-shot Plan Reconciliation Evidence Closure

on:
  push:
    branches:
      - governance/source-plan-reconciliation-s04-005-001

permissions:
  contents: write

concurrency:
  group: plan-reconciliation-evidence-closure
  cancel-in-progress: false

jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message, '[skip-evidence-closure]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/source-plan-reconciliation-s04-005-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Close reconciliation evidence fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from project_control.validate_control_plane import load_yaml

          expected_parent = 'd6cc9212d9da3e9415cfb1979c70652288e6e694'
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          if parent != expected_parent:
              raise SystemExit(f'unexpected evidence-closure parent: {parent}')

          trace = Path('project_control/TRACEABILITY_STATUS.csv')
          t = trace.read_text(encoding='utf-8')
          old_row = ',review_pack/command_registry.yaml,create_next_interview_round,supabase/migrations/20260906070000_interview_lifecycle_commands.sql,INTERVIEW-LIFECYCLE-001,IMPLEMENTED,,52f35ee,TASK-S04-002 interview lifecycle'
          new_row = ',review_pack/command_registry.yaml,create_next_interview_round,supabase/migrations/20260906060000_interview_schema_and_conflict_locking.sql,INTERVIEW-SCHEMA-001,IMPLEMENTED,,8c1913b,TASK-S04-001 accepted round allocation command'
          if t.count(old_row) != 1:
              raise SystemExit(f'create_next traceability old-row count={t.count(old_row)}')
          if new_row in t:
              raise SystemExit('create_next traceability new row already present unexpectedly')
          trace.write_text(t.replace(old_row, new_row, 1), encoding='utf-8')

          evidence = Path('project_control/EVIDENCE_INDEX.yaml')
          e = evidence.read_text(encoding='utf-8')
          old_summary = '''implementation_evidence:\n  status: SLICE_04_IN_PROGRESS_TASK_S04_005_ACCEPTED_MAINTENANCE_STOP\n  note: "All tasks through TASK-S04-005 are independently reviewed, serially integrated, and verified on exact-SHA GitHub Actions CI. Owner-authorized maintenance stop is armed before TASK-S04-004 dispatch."\n\n'''
          new_summary = '''implementation_evidence:\n  status: SLICE_04_IN_PROGRESS_TASK_S04_004_READY_PLAN_RECONCILED\n  note: "Accepted implementation through TASK-S04-005 remains independently reviewed and exact-SHA CI verified. Source-to-implementation-to-plan reconciliation is VERIFIED; TASK-S04-004 is READY on the reviewed v3 prompt and is the sole safe-frontier task."\n\n'''
          if e.count(old_summary) != 1:
              raise SystemExit(f'evidence stale-summary count={e.count(old_summary)}')
          e = e.replace(old_summary, new_summary, 1)

          anchor = '  COPY-INTERVIEW-SCHEDULE-001:\n'
          block = '''  PLAN-RECONCILIATION-S04-005-001:\n    operation: SOURCE_IMPLEMENTATION_PLAN_RECONCILIATION\n    status: VERIFIED\n    baseline_branch: governance/omp-native-reconstruction-001\n    baseline_head: "3c3073b52a4f83a8a5318376125e94913792fdf3"\n    canonical_source:\n      full_handover: "1.18"\n      business_logic: "1.2 FROZEN"\n      technical_architecture: "1.18 FROZEN"\n      design_system: "1.8 CURRENT"\n      reopen_required: false\n    accepted_implementation_through: TASK-S04-005\n    accepted_application_checkpoint: "8819d9fec1143e94aea7721e47ae84a8abcd82b9"\n    accepted_application_ci_run: "34039979411"\n    reconciliation_review_head: "a4d85a9033b3b54195265a893710d08a626ef9bb"\n    prompt_v2_review:\n      status: BLOCKING_REPAIR\n      findings:\n        - "Omitted accepted 20260906060000 interview schema/round-allocation migration from the effective backend baseline."\n        - "Used ambiguous idempotency-key wording that could regenerate a key on retry of the same mutation intent."\n    released_prompt:\n      path: project_control/prompts/SLICE-04_TASK-004_v3.md\n      sha256: "ae622650bd9d79af28c30a870f2c84d15aeac764ab4393cd5f7b343040b9c7ce"\n      independent_review: "PASS (ChatGPT exact-source reconciliation re-review @ a4d85a9033b3b54195265a893710d08a626ef9bb; blockers: NONE)"\n    planning:\n      task_slice_state: PASS\n      traceability_through_s04_005: PASS\n      cross_slice_prerequisites: PASS\n      s04_004_status: READY\n      safe_frontier:\n        - TASK-S04-004\n    validation:\n      release_checkpoint: "d6cc9212d9da3e9415cfb1979c70652288e6e694"\n      governance_ci_run: "34149683892"\n      governance_ci: PASS\n      validate_omp_native: PASS\n      validate_control_plane: PASS\n\n'''
          if '  PLAN-RECONCILIATION-S04-005-001:\n' in e:
              raise SystemExit('reconciliation evidence entry already exists')
          if e.count(anchor) != 1:
              raise SystemExit(f'evidence insertion anchor count={e.count(anchor)}')
          evidence.write_text(e.replace(anchor, block + anchor, 1), encoding='utf-8')

          # Fail-closed parse with the repository's duplicate-key loader.
          load_yaml(evidence)
          PY
          python project_control/validate_omp_native.py
          python project_control/validate_control_plane.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'project_control/EVIDENCE_INDEX.yaml\nproject_control/TRACEABILITY_STATUS.csv'
      - name: Commit evidence closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_control/EVIDENCE_INDEX.yaml project_control/TRACEABILITY_STATUS.csv
          git diff --cached --check
          git commit -m "chore: close S04-005 plan reconciliation evidence [skip-evidence-closure]"
          git push origin HEAD:governance/source-plan-reconciliation-s04-005-001
