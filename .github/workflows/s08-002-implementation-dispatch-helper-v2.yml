name: S08-002 Implementation Dispatch Helper v2

on:
  push:
    branches:
      - automation/s08-002-implementation-dispatch-helper-v2

permissions:
  contents: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize prompt review evidence and Owner dispatch state
        shell: bash
        run: |
          set -euo pipefail
          git show a8bffe71ddca48093759f2903d19ee8c1a18202d:project_control/reviews/S08_002_PROMPT_REVIEW_c3fd09b_v1.md > project_control/reviews/S08_002_PROMPT_REVIEW_c3fd09b_v1.md
          python - <<'PY'
          from pathlib import Path

          baseline = 'c3fd09b5cbe38205802b079560aff8452c6bbe3b'
          tag_obj = 'f5d9b5b2d5e3ef86514d23bb76f8ccc76b9ef003'
          evidence_commit = 'a8bffe71ddca48093759f2903d19ee8c1a18202d'
          task_branch = 'chatgpt/TASK-S08-002-durable-rate-limiting'

          p = Path('project_control/TASK_REGISTRY.yaml')
          text = p.read_text()
          marker = '\n  TASK-S08-002:\n'
          assert text.count(marker) == 1
          head, tail = text.split(marker, 1)
          old = '''    governed_pre_task_checkpoint: checkpoint/pre-S08-002-001\n    governed_pre_task_checkpoint_status: PENDING_CREATION_AFTER_MATERIALIZATION_VALIDATION\n    prompt_review_status: PENDING\n    prompt_review_work_id: S08-002-PROMPT-REVIEW-001\n    implementation_started: false\n    implementation_authorized: false\n    implementation_review_mode: OMP_EIU_REVIEWER\n'''
          new = f'''    governed_pre_task_checkpoint: checkpoint/pre-S08-002-001\n    governed_pre_task_checkpoint_status: VERIFIED\n    governed_pre_task_checkpoint_sha: "{baseline}"\n    governed_pre_task_checkpoint_tag_object: "{tag_obj}"\n    prompt_review_status: PASS\n    prompt_review_work_id: S08-002-PROMPT-REVIEW-001\n    prompt_review_reviewed_sha: "{baseline}"\n    prompt_review_artifact: project_control/reviews/S08_002_PROMPT_REVIEW_c3fd09b_v1.md\n    prompt_review_evidence_commit: "{evidence_commit}"\n    prompt_review_implementation_authorized: false\n    implementation_started: false\n    implementation_authorized: true\n    implementation_authorization_basis: "Explicit Owner dispatch ('tiếp tục') after independent prompt/source PASS; implementation may begin only on the isolated task branch under existing boundaries."\n    implementation_baseline_sha: "{baseline}"\n    implementation_branch: {task_branch}\n    producer: EXTERNAL_CHATGPT\n    implementation_review_mode: OMP_EIU_REVIEWER\n'''
          assert tail.count(old) == 1
          tail = tail.replace(old, new, 1)
          p.write_text(head + marker + tail)

          p = Path('project_control/AUTONOMY_RUN_STATE.yaml')
          text = p.read_text()
          assert text.count('slice_08_planning:') == 1
          prefix, tail = text.split('slice_08_planning:', 1)
          tail = tail.replace('  status: S08_002_MATERIALIZED_AWAITING_INDEPENDENT_PROMPT_REVIEW\n', '  status: S08_002_IMPLEMENTATION_AUTHORIZED_READY\n', 1)
          old = '''  governed_pre_task_checkpoint: checkpoint/pre-S08-002-001\n  governed_pre_task_checkpoint_status: PENDING_CREATION_AFTER_MATERIALIZATION_VALIDATION\n  prompt_review_status: PENDING\n  prompt_review_work_id: S08-002-PROMPT-REVIEW-001\n  implementation_started: false\n  implementation_authorized: false\n  producer_role: EXTERNAL_CHATGPT\n'''
          new = f'''  governed_pre_task_checkpoint: checkpoint/pre-S08-002-001\n  governed_pre_task_checkpoint_status: VERIFIED\n  governed_pre_task_checkpoint_sha: "{baseline}"\n  governed_pre_task_checkpoint_tag_object: "{tag_obj}"\n  prompt_review_status: PASS\n  prompt_review_work_id: S08-002-PROMPT-REVIEW-001\n  prompt_review_reviewed_sha: "{baseline}"\n  prompt_review_artifact: project_control/reviews/S08_002_PROMPT_REVIEW_c3fd09b_v1.md\n  prompt_review_evidence_commit: "{evidence_commit}"\n  implementation_started: false\n  implementation_authorized: true\n  implementation_authorization_basis: "Explicit Owner dispatch ('tiếp tục') after independent prompt/source PASS."\n  implementation_baseline_sha: "{baseline}"\n  implementation_branch: {task_branch}\n  producer_role: EXTERNAL_CHATGPT\n'''
          assert tail.count(old) == 1
          tail = tail.replace(old, new, 1)
          old_frontier = '''safe_frontier:\n  eligible_tasks: []\n  skipped_due_to_dependency:\n    - "TASK-S08-002 is materialized but implementation is held pending exact-SHA independent prompt/source review and later explicit Owner implementation dispatch."\n  materialization_frontier: []\n  execution_hold: "PROMPT REVIEW HARD STOP for TASK-S08-002. Do not start implementation, mutate main, deploy Vercel, or mutate connected/hosted Supabase."\n\nstop_gate:\n  status: ACTIVE\n  type: S08_002_INDEPENDENT_PROMPT_REVIEW_GATE\n  source_reopen_required: false\n  resume_on: "Independent OMP prompt/source review of checkpoint/pre-S08-002-001 returns PASS with SOURCE_REOPEN_REQUIRED=false, followed by Owner-transported persistence. Implementation still requires a separate explicit Owner dispatch."\n\nnext_action: "SAFE CHECKPOINT: create and verify immutable checkpoint/pre-S08-002-001 after this materialization validates, then stop for independent OMP prompt/source review. Implementation remains unauthorized."\n'''
          new_frontier = '''safe_frontier:\n  eligible_tasks:\n    - TASK-S08-002\n  skipped_due_to_dependency: []\n  materialization_frontier: []\n  execution_hold: null\n\nstop_gate:\n  status: RELEASED_TO_IMPLEMENTATION\n  type: S08_002_IMPLEMENTATION_DISPATCH_GATE\n  source_reopen_required: false\n  resume_on: "Producer may begin TASK-S08-002 implementation from exact governed baseline c3fd09b5cbe38205802b079560aff8452c6bbe3b on chatgpt/TASK-S08-002-durable-rate-limiting. Independent OMP implementation review remains mandatory before integration."\n\nnext_action: "SAFE CHECKPOINT: begin TASK-S08-002 implementation on chatgpt/TASK-S08-002-durable-rate-limiting from governed baseline c3fd09b5cbe38205802b079560aff8452c6bbe3b; preserve all deployment/main/hosted-Supabase boundaries and stop at an independently reviewable candidate SHA."\n'''
          assert tail.count(old_frontier) == 1
          tail = tail.replace(old_frontier, new_frontier, 1)
          text = prefix + 'slice_08_planning:' + tail
          text = text.replace('  current_prompt_review_target_sha: "141146d52a05b0d698178ba7ef097690d5ef2a27"', f'  current_prompt_review_target_sha: "{baseline}"', 1)
          p.write_text(text)

          p = Path('project_control/EVIDENCE_INDEX.yaml')
          text = p.read_text()
          text = text.replace('  status: S08_002_MATERIALIZED_AWAITING_INDEPENDENT_PROMPT_REVIEW\n  note: "TASK-S08-002 is now materialized for prompt review only after independent source-reconciliation PASS. Implementation remains unauthorized; checkpoint/pre-S08-002-001 must be created and independently reviewed before any implementation dispatch."', '  status: S08_002_IMPLEMENTATION_AUTHORIZED_READY\n  note: "TASK-S08-002 prompt/source review PASS is persisted and explicit Owner implementation dispatch has been received. Implementation is authorized but has not started; execution is isolated to the task branch."', 1)
          old = '''    governed_pre_task_checkpoint: checkpoint/pre-S08-002-001\n    governed_pre_task_checkpoint_status: PENDING_CREATION_AFTER_MATERIALIZATION_VALIDATION\n    prompt_review_status: PENDING\n    implementation_started: false\n    implementation_authorized: false\n'''
          new = f'''    governed_pre_task_checkpoint: checkpoint/pre-S08-002-001\n    governed_pre_task_checkpoint_status: VERIFIED\n    governed_pre_task_checkpoint_sha: "{baseline}"\n    governed_pre_task_checkpoint_tag_object: "{tag_obj}"\n    prompt_review_status: PASS\n    prompt_review_work_id: S08-002-PROMPT-REVIEW-001\n    prompt_review_reviewed_sha: "{baseline}"\n    prompt_review_artifact: project_control/reviews/S08_002_PROMPT_REVIEW_c3fd09b_v1.md\n    prompt_review_evidence_commit: "{evidence_commit}"\n    implementation_started: false\n    implementation_authorized: true\n    implementation_baseline_sha: "{baseline}"\n    implementation_branch: {task_branch}\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('project_control/CURRENT_STATE.md')
          text = p.read_text()
          old = '''- Intended immutable pre-task checkpoint: `checkpoint/pre-S08-002-001`; create only after materialization validators/diff pass.\n- Prompt review status: PENDING. Implementation started: false. Implementation authorized: false.\n\n## Slice-08 frontier\n\n- Slice-08 remains `IN_PROGRESS`; current governed task is `TASK-S08-002`.\n- Safe frontier for implementation is empty while the independent prompt/source review gate is active.\n- Next allowed action is creation/verification of `checkpoint/pre-S08-002-001`, followed by independent OMP prompt review of that exact SHA.\n- A prompt-review PASS does not itself authorize implementation; explicit Owner implementation dispatch remains required.\n\n## Scope boundary\n\nTASK-S08-001 remains immutable and accepted at `checkpoint/S08-001-accepted-001`. TASK-S08-002 is materialized for prompt review only. Do not mutate `main`, deploy Vercel, mutate connected/hosted Supabase, use production secrets, move accepted checkpoints, or begin S08-002 implementation from this materialization transition.\n'''
          new = f'''- Immutable pre-task checkpoint: `checkpoint/pre-S08-002-001` -> `{baseline}`; annotated tag object `{tag_obj}`.\n- Independent prompt/source review `S08-002-PROMPT-REVIEW-001`: PASS on exact `{baseline}`, source reopen false, findings NONE. Evidence persisted at `project_control/reviews/S08_002_PROMPT_REVIEW_c3fd09b_v1.md` (`{evidence_commit}`).\n- Explicit Owner implementation dispatch received after PASS. Implementation authorized: true. Implementation started: false.\n- Isolated implementation branch: `{task_branch}` from exact governed baseline `{baseline}`.\n\n## Slice-08 frontier\n\n- Slice-08 remains `IN_PROGRESS`; current governed task is `TASK-S08-002`.\n- TASK-S08-002 is implementation-ready on its isolated branch; no product write has started yet.\n- Next allowed action is producer implementation from the exact governed baseline, followed by producer self-audit and independent OMP implementation review before any integration serialization.\n\n## Scope boundary\n\nTASK-S08-001 remains immutable and accepted at `checkpoint/S08-001-accepted-001`. TASK-S08-002 implementation is authorized only on its isolated task branch. Do not mutate `main`, deploy Vercel, mutate connected/hosted Supabase, use production secrets, move accepted checkpoints, or bypass independent implementation review.\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Validate dispatch state
        shell: bash
        run: |
          set -euo pipefail
          python project_control/validate_control_plane.py
          python project_control/validate_omp_native.py
          git diff --check c3fd09b5cbe38205802b079560aff8452c6bbe3b --
          grep -F 'prompt_review_status: PASS' project_control/TASK_REGISTRY.yaml
          grep -F 'implementation_started: false' project_control/TASK_REGISTRY.yaml
          grep -F 'implementation_authorized: true' project_control/TASK_REGISTRY.yaml

      - name: Commit clean implementation-ready state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/s08-002-implementation-dispatch-helper-v2.yml
          git add project_control .github/workflows/s08-002-implementation-dispatch-helper-v2.yml
          git diff --cached --check
          git commit -m 'chore(s08-002): authorize isolated implementation dispatch'
          final_changed="$(git diff --name-only c3fd09b5cbe38205802b079560aff8452c6bbe3b...HEAD | sort)"
          final_expected="$(printf '%s\n' \
            project_control/AUTONOMY_RUN_STATE.yaml \
            project_control/CURRENT_STATE.md \
            project_control/EVIDENCE_INDEX.yaml \
            project_control/TASK_REGISTRY.yaml \
            project_control/reviews/S08_002_PROMPT_REVIEW_c3fd09b_v1.md | sort)"
          test "$final_changed" = "$final_expected"
          git push origin HEAD:automation/s08-002-implementation-dispatch-helper-v2
