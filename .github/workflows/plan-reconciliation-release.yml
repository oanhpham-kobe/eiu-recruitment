name: One-shot S04-005 Reconciliation Release

on:
  push:
    branches:
      - governance/source-plan-reconciliation-s04-005-001

permissions:
  contents: write

concurrency:
  group: s04-005-reconciliation-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip-reconciliation-release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/source-plan-reconciliation-s04-005-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Release reconciliation gate fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          expected_review_head = 'a4d85a9033b3b54195265a893710d08a626ef9bb'
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          if parent != expected_review_head:
              raise SystemExit(f'unexpected release parent: {parent}')

          prompt = Path('project_control/prompts/SLICE-04_TASK-004_v3.md')
          prompt_hash = hashlib.sha256(prompt.read_bytes()).hexdigest()
          expected_hash = 'ae622650bd9d79af28c30a870f2c84d15aeac764ab4393cd5f7b343040b9c7ce'
          if prompt_hash != expected_hash:
              raise SystemExit(f'prompt hash mismatch: {prompt_hash}')

          def replace_one(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: match count={count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_one(
              'project_control/TASK_REGISTRY.yaml',
              '''  TASK-S04-004:\n    title: "HR Interview scheduling UI over accepted trusted commands"\n    slice: SLICE-04\n    status: BLOCKED\n    lane: LANE_A\n    depends_on:\n      - TASK-S04-005\n    prompt: project_control/prompts/SLICE-04_TASK-004_v3.md\n    prompt_sha256: ae622650bd9d79af28c30a870f2c84d15aeac764ab4393cd5f7b343040b9c7ce\n    prompt_review_status: "PENDING_INDEPENDENT_REVIEW"\n    notes: "TASK-S04-005 dependency is satisfied and CI-verified. Independent reconciliation review found v2 omitted accepted migration 20260906060000 and used ambiguous retry-key wording. v3 repairs the complete ordered backend baseline and operation-scoped idempotency-key reuse semantics. Dispatch remains blocked by PLAN_RECONCILIATION_GATE_S04_005 pending exact v3 re-review."\n''',
              '''  TASK-S04-004:\n    title: "HR Interview scheduling UI over accepted trusted commands"\n    slice: SLICE-04\n    status: READY\n    lane: LANE_A\n    depends_on:\n      - TASK-S04-005\n    prompt: project_control/prompts/SLICE-04_TASK-004_v3.md\n    prompt_sha256: ae622650bd9d79af28c30a870f2c84d15aeac764ab4393cd5f7b343040b9c7ce\n    prompt_review_status: "PASS (ChatGPT exact-source reconciliation re-review @ a4d85a9033b3b54195265a893710d08a626ef9bb; blockers: NONE)"\n    notes: "TASK-S04-005 dependency is satisfied and CI-verified. Reconciliation review found and repaired the v2 backend-baseline/idempotency ambiguities in v3. Exact-source v3 re-review passed with no canonical-source reopening; TASK-S04-004 is READY for the authorized frontier after reconciliation release."\n''',
              'TASK-S04-004 release block',
          )

          replace_one(
              'project_control/AUTONOMY_RUN_STATE.yaml',
              '''plan_reconciliation:\n  gate: PLAN_RECONCILIATION_GATE_S04_005\n  status: IN_PROGRESS\n  baseline_branch: governance/omp-native-reconstruction-001\n  baseline_head: "3c3073b52a4f83a8a5318376125e94913792fdf3"\n  accepted_implementation_through: TASK-S04-005\n  canonical_source_reopen_required: false\n  feature_dispatch: HELD\n''',
              '''plan_reconciliation:\n  gate: PLAN_RECONCILIATION_GATE_S04_005\n  status: VERIFIED\n  baseline_branch: governance/omp-native-reconstruction-001\n  baseline_head: "3c3073b52a4f83a8a5318376125e94913792fdf3"\n  review_head: "a4d85a9033b3b54195265a893710d08a626ef9bb"\n  accepted_implementation_through: TASK-S04-005\n  canonical_source_reopen_required: false\n  prompt: project_control/prompts/SLICE-04_TASK-004_v3.md\n  prompt_sha256: "ae622650bd9d79af28c30a870f2c84d15aeac764ab4393cd5f7b343040b9c7ce"\n  independent_review: "PASS (ChatGPT exact-source reconciliation re-review; blockers: NONE)"\n  feature_dispatch: RELEASED\n''',
              'plan_reconciliation release',
          )

          replace_one(
              'project_control/AUTONOMY_RUN_STATE.yaml',
              '''safe_frontier:\n  eligible_tasks: []\n  skipped_due_to_dependency: []\n  execution_hold: "PLAN_RECONCILIATION_GATE_S04_005"\nstop_state:\n  stop_gate: PLAN_RECONCILIATION_GATE_S04_005\n  reason: "Accepted implementation through TASK-S04-005 is being reconciled against current canonical source and downstream planning before TASK-S04-004 dispatch."\n  observed_evidence:\n    - "TASK-S04-005 ACCEPTED: exact integration CI 34039979411 PASS."\n    - "TASK-S04-005 implementation SHA ab6c5194d15eb29e2ee285106c6bef14f0291ec3 independently re-reviewed PASS."\n    - "Workspace/worktree consolidation maintenance completed and is no longer the active stop reason."\nnext_action: "Complete source-to-implementation-to-plan reconciliation, independently review the rebaselined TASK-S04-004 prompt, and keep feature dispatch held until the reconciliation gate passes."\n''',
              '''safe_frontier:\n  eligible_tasks:\n    - TASK-S04-004\n  skipped_due_to_dependency: []\nnext_action: "Dispatch TASK-S04-004 from the reconciled safe frontier using project_control/prompts/SLICE-04_TASK-004_v3.md under active AUTONOMOUS governance."\n''',
              'safe frontier release',
          )

          state = Path('project_control/CURRENT_STATE.md')
          s = state.read_text(encoding='utf-8')
          old_section = '''## Current reconciliation gate\n\nCurrent gate:\n\n`SOURCE → IMPLEMENTATION → PLAN RECONCILIATION @ TASK-S04-005`\n\nFeature dispatch remains intentionally held while the accepted implementation through S04-005 is reconciled with task/slice/runtime/traceability/downstream planning.\n\nThe original S04-004 prompt review correctly blocked dispatch until the application-reactivation and participant-contract repair was accepted. That dependency is now satisfied. A rebaselined prompt is being reviewed before the task is released:\n\n`project_control/prompts/SLICE-04_TASK-004_v3.md`\n\nUntil the reconciliation/review gate passes, authoritative task state remains `BLOCKED`; this derived snapshot does not release work by itself.\n'''
          new_section = '''## Plan reconciliation result and current frontier\n\n`SOURCE → IMPLEMENTATION → PLAN RECONCILIATION @ TASK-S04-005` is **VERIFIED**.\n\n- Accepted implementation is reconciled through `TASK-S04-005`.\n- No canonical Business Logic v1.2 / Technical Architecture v1.18 reopening was required.\n- The initial v2 prompt re-review found two blocking ambiguities (missing accepted `20260906060000` baseline and retry-key wording); both were repaired in v3.\n- Exact-source v3 re-review at `a4d85a9033b3b54195265a893710d08a626ef9bb` passed with no remaining blockers.\n- Authoritative task state is now `TASK-S04-004 = READY`.\n- Safe frontier is `TASK-S04-004`.\n\nReleased prompt:\n\n`project_control/prompts/SLICE-04_TASK-004_v3.md`\n'''
          if s.count(old_section) != 1:
              raise SystemExit(f'CURRENT_STATE reconciliation section count={s.count(old_section)}')
          s = s.replace(old_section, new_section, 1)
          old_resume = '''6. confirm the `PLAN_RECONCILIATION_GATE_S04_005` state and exact accepted checkpoint;\n7. review the reconciliation diff and `SLICE-04_TASK-004_v3.md` against current canonical source and the accepted ordered migration chain through `20260906090000_application_reactivation_and_participant_contract_repair.sql`;\n8. if the reconciliation review passes with no source reopening, release S04-004 truthfully in the authoritative registries/run state;\n9. only then continue S04-004 implementation → focused verification → independent implementation review → repair/re-review if needed → serialized integration → exact-SHA CI → next safe frontier.\n'''
          new_resume = '''6. confirm `plan_reconciliation.status = VERIFIED`, `TASK-S04-004 = READY`, and `safe_frontier = [TASK-S04-004]`;\n7. read `SLICE-04_TASK-004_v3.md` plus its canonical business/design/backend sources and the accepted ordered migration chain through `20260906090000_application_reactivation_and_participant_contract_repair.sql`;\n8. continue S04-004 implementation → focused verification → independent implementation review → repair/re-review if needed → serialized integration → exact-SHA CI → next safe frontier.\n'''
          if s.count(old_resume) != 1:
              raise SystemExit(f'CURRENT_STATE resume block count={s.count(old_resume)}')
          s = s.replace(old_resume, new_resume, 1)
          old_next = '''## Next action\n\nComplete the S04-005 source-to-implementation-to-plan reconciliation and independent prompt/reconciliation review. Do not dispatch `TASK-S04-004` until that gate passes.\n'''
          new_next = '''## Next action\n\nUse the released `SLICE-04_TASK-004_v3.md` and dispatch `TASK-S04-004` from the reconciled safe frontier under active AUTONOMOUS governance.\n'''
          if s.count(old_next) != 1:
              raise SystemExit(f'CURRENT_STATE next-action count={s.count(old_next)}')
          state.write_text(s.replace(old_next, new_next, 1), encoding='utf-8')

          changelog = Path('project_control/CHANGELOG_IMPLEMENTATION.md')
          c = changelog.read_text(encoding='utf-8')
          marker = '## 2026-09-08 — S04-005 source-to-plan reconciliation released'
          if marker in c:
              raise SystemExit('changelog release marker already exists')
          c += '''\n\n## 2026-09-08 — S04-005 source-to-plan reconciliation released\n\n- Reconciled task/slice/runtime/traceability/downstream prerequisite state against Full Handover v1.18 and accepted implementation through TASK-S04-005.\n- Confirmed no canonical Business Logic v1.2 / Technical Architecture v1.18 reopening is required.\n- Initial S04-004 v2 reconciliation review found two blocking prompt defects: omitted accepted migration `20260906060000_interview_schema_and_conflict_locking.sql` from the effective backend chain and ambiguous idempotency retry-key wording.\n- Repaired both defects in `project_control/prompts/SLICE-04_TASK-004_v3.md` (`ae622650bd9d79af28c30a870f2c84d15aeac764ab4393cd5f7b343040b9c7ce`).\n- Exact-source v3 re-review at reconciliation review head `a4d85a9033b3b54195265a893710d08a626ef9bb`: PASS, blockers NONE.\n- Released `TASK-S04-004` to READY and materialized it as the sole safe-frontier task.\n'''
          changelog.write_text(c, encoding='utf-8')
          PY
          python project_control/validate_omp_native.py
          python project_control/validate_control_plane.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'project_control/AUTONOMY_RUN_STATE.yaml\nproject_control/CHANGELOG_IMPLEMENTATION.md\nproject_control/CURRENT_STATE.md\nproject_control/TASK_REGISTRY.yaml'
      - name: Commit reconciliation release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_control/AUTONOMY_RUN_STATE.yaml project_control/TASK_REGISTRY.yaml project_control/CURRENT_STATE.md project_control/CHANGELOG_IMPLEMENTATION.md
          git diff --cached --check
          git commit -m "chore: release S04-004 after plan reconciliation [skip-reconciliation-release]"
          git push origin HEAD:governance/source-plan-reconciliation-s04-005-001
