name: DS Primitive Self-Review Once

on:
  push:
    branches:
      - oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001

permissions:
  contents: read

concurrency:
  group: ds-primitives-selfreview-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Primitive static and browser interaction verification
        working-directory: web
        run: node --conditions react-server --test --import tsx src/__tests__/design-primitives.test.ts src/__tests__/design-primitives-browser.test.ts
      - name: Diff hygiene
        run: git diff --check
