name: S06-001 Create Review Repair Migration

on:
  push:
    branches:
      - patch/S06-001-review-blockers-r1

permissions:
  contents: write

jobs:
  create-migration:
    if: ${{ !contains(github.event.head_commit.message, 'create review repair migration file') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0
      - name: Create migration through Supabase CLI
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new s06_001_review_repairs
          git status --short
          test "$(git status --short 'supabase/migrations/*_s06_001_review_repairs.sql' | wc -l)" -eq 1
      - name: Commit generated migration only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*_s06_001_review_repairs.sql
          git commit -m 'chore(s06-001): create review repair migration file'
          git push origin HEAD:patch/S06-001-review-blockers-r1
