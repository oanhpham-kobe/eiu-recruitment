name: S06-001 R2 Candidate Document RED

on:
  push:
    branches:
      - validate/S06-001-r1-r2-red

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: supabase db reset
      - name: Prove inactive historical REPLACE is blocked by the frozen R1 candidate
        shell: bash
        run: |
          set +e
          docker exec -i supabase_db_eiu-recruitment-dev psql -U postgres -d postgres < supabase/tests/master_data_candidate_document_history_test.sql > /tmp/r2.log 2>&1
          status=$?
          set -e
          cat /tmp/r2.log
          test "$status" -ne 0
          grep -F 'MASTER_INACTIVE_NOT_SELECTABLE:document_types' /tmp/r2.log
      - name: Stop local Supabase
        if: always()
        run: supabase stop
