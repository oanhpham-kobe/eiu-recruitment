name: S07-004 One-shot Governance Reconciliation

on:
  push:
    branches:
      - chatgpt/TASK-S07-004-physical-storage-cleanup-runner

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2
      - name: Reconcile S07-004 review-gate state
        run: python project_control/validators/reconcile_s07_004_review_gate_once.py
      - name: Validate reconciled control plane
        run: |
          python project_control/validate_control_plane.py
          python project_control/validate_omp_native.py
          git diff --check
      - name: Commit governance reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_control/TASK_REGISTRY.yaml project_control/AUTONOMY_RUN_STATE.yaml project_control/CURRENT_STATE.md
          git commit -m 'chore(governance): gate S07-004 for independent review'
          git push origin HEAD:chatgpt/TASK-S07-004-physical-storage-cleanup-runner
