name: S04-004 Search Cap Repair Once

on:
  push:
    branches:
      - oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
    paths:
      - .github/s04_004_search_cap_repair.py
      - .github/workflows/s04-004-search-cap-repair-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply reviewed search-cap repair
        run: python .github/s04_004_search_cap_repair.py
      - name: Normalize focused test and dynamic select typing
        shell: bash
        run: |
          sed -i '/^  then<TResult1/ i\  // biome-ignore lint/suspicious/noThenProperty: Supabase query builders are intentionally awaitable in this test double.' web/src/__tests__/interview-search-contract.test.ts
          python - <<'PY'
          from pathlib import Path
          path = Path("web/src/lib/interview/server.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  const submissionEmbed = query
            ? ",filtered_submission:submissions!inner(submission_id,full_name,email_snapshot,phone)"
            : "";
          let appBuilder = client
            .from("applications")
            .select(
              `application_id,submission_id,version_no,unit_id,department_team_id,position_id${submissionEmbed}`,
            )
          '''
          new = '''  const submissionEmbed = query
            ? ",filtered_submission:submissions!inner(submission_id,full_name,email_snapshot,phone)"
            : "";
          const applicationSelect: string = `application_id,submission_id,version_no,unit_id,department_team_id,position_id${submissionEmbed}`;
          let appBuilder = client
            .from("applications")
            .select(applicationSelect)
          '''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"expected one dynamic Application select, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Format affected files
        working-directory: web
        run: npx biome check --write src/lib/interview/server.ts src/__tests__/interview-search-contract.test.ts
      - name: Lint affected files
        working-directory: web
        run: npx biome check src/lib/interview/server.ts src/__tests__/interview-search-contract.test.ts
      - name: Focused search-contract regression
        working-directory: web
        run: node --conditions react-server --test --import tsx src/__tests__/interview-search-contract.test.ts src/__tests__/interview-model.test.ts
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Commit verified repair and remove staging helpers
        shell: bash
        run: |
          rm .github/workflows/s04-004-search-cap-repair-once.yml
          rm .github/s04_004_search_cap_repair.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(s04): remove copy target PII presearch cap"
          git push origin HEAD:oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
