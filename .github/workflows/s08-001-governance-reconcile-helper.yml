name: S08-001 Governance Reconcile Helper

on:
  push:
    branches:
      - automation/s08-001-governance-reconcile-helper

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Apply exact S08-001 governance reconciliation
        run: python project_control/_tmp_s08_001_governance_reconcile.py

      - name: Validate reconciled control plane
        run: |
          python project_control/validate_control_plane.py
          python project_control/validate_omp_native.py
          git diff --check

      - name: Remove one-shot helper files
        run: |
          rm project_control/_tmp_s08_001_governance_reconcile.py
          rm .github/workflows/s08-001-governance-reconcile-helper.yml
          git diff --check

      - name: Commit reconciled governance tree
        run: |
          git config user.name "oanhpham-kobe"
          git config user.email "oanh.pham@eiu.edu.vn"
          git add -A
          git status --short
          git commit -m "chore(governance): stage S08-001 final acceptance gate"
          git push origin HEAD:automation/s08-001-governance-reconcile-helper
