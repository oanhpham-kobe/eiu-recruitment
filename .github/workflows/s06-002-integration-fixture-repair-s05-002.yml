name: S06-002 Integration Fixture Repair S05-002

on:
  push:
    branches:
      - control/S06-002-integration-fixture-repair-s05-002

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Patch accepted S05-002 fixture for canonical owner eligibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a947a210f965c7a111cfd6e2dc5b27e8db83384c'
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/tests/hr_report_management_test.sql')
          text = p.read_text()
          needle = """  returning app_user_id into v_hr;\n\n  insert into public.app_users(auth_user_id, full_name, email, is_active)\n  values (v_status_auth, 'S05-002 Status Only', 's05002_status_' || v_suffix || '@eiu.edu.vn', true)\n"""
          replacement = """  returning app_user_id into v_hr;\n\n  -- S06-002 canonical active-Application owner eligibility requires the\n  -- fixture HR owner to hold the HR role before active Applications exist.\n  insert into public.app_user_roles(app_user_id, role_code)\n  values (v_hr, 'HR');\n\n  insert into public.app_users(auth_user_id, full_name, email, is_active)\n  values (v_status_auth, 'S05-002 Status Only', 's05002_status_' || v_suffix || '@eiu.edu.vn', true)\n"""
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one S05-002 HR fixture insertion point, found {text.count(needle)}')
          p.write_text(text.replace(needle, replacement, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = 'supabase/tests/hr_report_management_test.sql'
          grep -q "values (v_hr, 'HR');" supabase/tests/hr_report_management_test.sql
      - name: Commit fixture-only repair on control branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/hr_report_management_test.sql
          git commit -m 'test(s05-002): align owner fixture with S06-002 eligibility'
          git push origin HEAD:control/S06-002-integration-fixture-repair-s05-002
