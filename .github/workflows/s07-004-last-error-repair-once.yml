name: S07-004 One-shot Last Error Expectation Repair

on:
  push:
    branches:
      - chatgpt/TASK-S07-004-physical-storage-cleanup-runner

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2
      - name: Align successful completion last_error expectation with S07-003 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/__tests__/storage-cleanup-local.integration.ts')
          text = path.read_text()
          old = r'^DONE\|AUTHORIZED\|2\|PROVIDER_TIMEOUT$'
          new = r'^DONE\|AUTHORIZED\|2\|$'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly 1 retry-success last_error assertion, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Diff hygiene
        run: git diff --check -- web/src/__tests__/storage-cleanup-local.integration.ts
      - name: Commit bounded harness repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/__tests__/storage-cleanup-local.integration.ts
          git commit -m 'test(storage): align successful retry settlement assertion'
          git push origin HEAD:chatgpt/TASK-S07-004-physical-storage-cleanup-runner
