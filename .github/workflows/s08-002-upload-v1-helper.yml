      - name: Commit exact validated upload product delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/s08-002-upload-v1-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check 2a1da20463303162cad00892de904d6d1b2f8439
          changed=$(git diff --name-only 2a1da20463303162cad00892de904d6d1b2f8439 | sort)
          echo "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^\.github/workflows/' || true)" -eq 0
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 10
          test "$(printf '%s\n' "$changed" | grep -c '^supabase/migrations/.*_interview_upload_rate_limit_boundaries\.sql$')" -eq 1
          git add -A
          git commit -m 'feat(s08-002): harden upload rate-limit boundaries'
          git push origin HEAD:work/S08-002-upload-v1
