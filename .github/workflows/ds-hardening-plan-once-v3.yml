name: DS Hardening Plan Once v3

on:
  push:
    branches:
      - governance/design-system-hardening-001

permissions:
  contents: write

concurrency:
  group: ds-hardening-plan-once-v3
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Configure one-shot commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Materialize hardening plan
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('project_control/tools/ds_hardening_plan_patch.py')
          s = p.read_text(encoding='utf-8')
          old = 'task = task.rstrip() + append_tasks + "\\n"'
          new = 'task = task.rstrip() + append_tasks.rstrip() + "\\n"'
          if s.count(old) != 1:
              raise SystemExit('serializer anchor mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python project_control/tools/ds_hardening_plan_patch.py
