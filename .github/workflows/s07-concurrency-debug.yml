name: S07 Concurrency Debug

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s07-concurrency-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s07-concurrency:
    name: S07 staged worker concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0

      - name: Start disposable Supabase
        run: supabase start

      - name: Replay migrations from zero
        run: supabase db reset

      - name: Run S07 staged worker concurrency assertions
        run: bash supabase/tests/email_persistence_concurrency_test.sh

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop
