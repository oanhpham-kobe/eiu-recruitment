name: Integration CI

on:
  push:
    branches:
      - autonomy/continuous-integration-20260905-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Ensure npm 11.19.0
        shell: bash
        run: |
          if [ "$(npm --version)" != "11.19.0" ]; then
            npm install --global npm@11.19.0
          fi
          test "$(npm --version)" = "11.19.0"

      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  db-integration:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase start

      - name: Replay migrations from zero
        run: supabase db reset

      - name: Execute PRE-S04 Database Integration & Regression Assertions
        run: |
          docker exec -i supabase_db_eiu-recruitment-dev psql -U postgres -d postgres < supabase/tests/pre_s04_contract_repairs_test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop
