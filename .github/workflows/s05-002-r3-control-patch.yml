name: S05-002 R3 Control Patch

on:
  push:
    branches:
      - control/S05-002-R3-gate-f4e1a04

permissions:
  contents: write

jobs:
  materialize-review-gate:
    if: ${{ !contains(github.event.head_commit.message, 'materialize R3 review gate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Patch authoritative state
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
          git diff --check
      - name: Commit R3 authority state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_control/AUTONOMY_RUN_STATE.yaml
          git diff --cached --check
          git commit -m "chore(state): materialize R3 review gate authority"
          git push
