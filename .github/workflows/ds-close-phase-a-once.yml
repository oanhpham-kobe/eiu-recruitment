name: DS Close Phase A Once

on:
  push:
    branches:
      - oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001

permissions:
  contents: write

concurrency:
  group: ds-close-phase-a-once
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply Phase-A closure
        run: python project_control/tools/ds_close_phase_a.py
      - name: Validate OMP-native integration
        run: python project_control/validate_omp_native.py
      - name: Validate durable control plane
        run: python project_control/validate_control_plane.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit Phase-A closure if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Phase-A changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_control/TASK_REGISTRY.yaml project_control/SLICE_REGISTRY.yaml project_control/AUTONOMY_RUN_STATE.yaml project_control/EVIDENCE_INDEX.yaml project_control/CURRENT_STATE.md project_control/CHANGELOG_IMPLEMENTATION.md
          git commit -m "chore(ds): close hardening Phase A"
          git push origin HEAD:oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001
