name: S08-002 Interview Upload Migration Name
on:
  push:
    branches:
      - automation/s08-002-interview-upload-migration-name
permissions:
  contents: read
jobs:
  name:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0
      - name: Generate canonical migration filename
        shell: bash
        run: |
          set -euo pipefail
          before="$(find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort)"
          supabase migration new interview_upload_rate_limit_boundaries
          after="$(find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort)"
          comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after")
