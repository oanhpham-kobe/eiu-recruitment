name: One-shot S04-005 Plan Reconciliation

on:
  push:
    branches:
      - governance/source-plan-reconciliation-s04-005-001

permissions:
  contents: write

concurrency:
  group: s04-005-plan-reconciliation-one-shot
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip plan-reconciliation-runner]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: governance/source-plan-reconciliation-s04-005-001
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Apply fail-closed reconciliation patch
        run: python project_control/tools/apply_plan_reconciliation_phase3.py

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_control/TASK_REGISTRY.yaml \
                  project_control/AUTONOMY_PARALLEL_GOVERNANCE.md \
                  project_control/validate_control_plane.py
          git diff --cached --check
          git commit -m "chore: reconcile S04-005 planning semantics [skip plan-reconciliation-runner]"
          git push origin HEAD:governance/source-plan-reconciliation-s04-005-001
