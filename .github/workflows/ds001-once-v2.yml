name: DS-001 Once v2

on:
  push:
    branches:
      - oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001

permissions:
  contents: write

concurrency:
  group: ds001-once-v2
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Configure one-shot commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Repair patcher anchor and apply DS-001
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('project_control/tools/ds001_patch.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('# 5) Focused token test asserts both generic and scoped meanings.')
          end = s.index('# 6) Fail closed if any CSS var consumer remains undeclared after the convergence pass.')
          replacement = '''# 5) Focused token test asserts both generic and scoped meanings.\ntest = TOKEN_TEST.read_text(encoding="utf-8")\nanchor = r'  assert.match(tokensCss, /--badge-width-interview:\\s*112px/);'\nif test.count(anchor) != 1:\n    raise RuntimeError(f"token test operational badge: expected one anchor, got {test.count(anchor)}")\ntest = test.replace(anchor, anchor + "\\n" + r'  assert.match(tokensCss, /--badge-width-interview-operational:\\s*144px/);', 1)\nwrite(TOKEN_TEST, test)\n\n'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY
          python project_control/tools/ds001_patch.py
