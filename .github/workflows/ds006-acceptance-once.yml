name: DS-006 Acceptance Once

on:
  push:
    branches:
      - oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001

permissions:
  contents: write

concurrency:
  group: ds006-acceptance-once
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium for production browser acceptance
        working-directory: web
        run: npx playwright install chromium
      - name: Format DS-006 acceptance artifacts
        working-directory: web
        run: npx biome check --write src/__tests__/design-browser-acceptance.test.ts src/__tests__/fixtures/design-browser-acceptance-harness.tsx package.json
      - name: Persist deterministic formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- web/src/__tests__/design-browser-acceptance.test.ts web/src/__tests__/fixtures/design-browser-acceptance-harness.tsx web/package.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add web/src/__tests__/design-browser-acceptance.test.ts web/src/__tests__/fixtures/design-browser-acceptance-harness.tsx web/package.json
            git commit -m 'test(ds): format browser acceptance artifacts'
            git push origin HEAD:oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001
          fi
      - name: Validate production design contract
        working-directory: web
        run: npm run design:check
      - name: Lint final Design-System web scope
        working-directory: web
        run: npm run lint
      - name: Typecheck final Design-System web scope
        working-directory: web
        run: npm run typecheck
      - name: Build final Design-System web scope
        working-directory: web
        run: npm run build
      - name: Run full web regression including seven-width browser acceptance matrix
        working-directory: web
        run: npm test
      - name: Verify clean diff hygiene
        run: git diff --check
