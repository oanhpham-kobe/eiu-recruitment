name: S04 Search Join Repair Once

on:
  push:
    branches:
      - oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
    paths:
      - .github/s04_search_join_patch.py
      - .github/workflows/s04-search-join-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply PII search join repair
        run: python .github/s04_search_join_patch.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Format affected server file
        working-directory: web
        run: npx biome check --write src/lib/interview/server.ts
      - name: Lint affected server file
        working-directory: web
        run: npx biome check src/lib/interview/server.ts
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Commit verified repair and remove staging helpers
        shell: bash
        run: |
          rm .github/workflows/s04-search-join-repair-once.yml
          rm .github/s04_search_join_patch.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(s04): keep PII search application-scoped"
          git push origin HEAD:oanhpham-kobe/TASK-S04-004-interview-scheduling-ui-v2
