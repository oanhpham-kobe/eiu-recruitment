name: DS-002-003 Once

on:
  push:
    branches:
      - oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001

permissions:
  contents: write

concurrency:
  group: ds002-003-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Configure one-shot commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Repair focused harness/semantics and apply DS-002/003
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('project_control/tools/ds002_003_patch.py')
          s = p.read_text(encoding='utf-8')

          regex_line = '  assert.match(layout, /pathname === "\\\\/candidate"/);'
          if regex_line in s:
              s = s.replace(regex_line, '  assert.ok(layout.includes(\'pathname === "/candidate"\'));', 1)
          elif '  assert.ok(layout.includes(\'pathname === "/candidate"\'));' not in s:
              raise SystemExit('design-shell test anchor missing')

          old_switcher = '''        <div className="language-switcher" role="group" aria-label="Chọn ngôn ngữ / Choose language">
          <button type="button" className="lang-btn active" aria-pressed="true" aria-label="Tiếng Việt (Đang chọn / Selected)">VI</button>
          <span className="lang-divider" aria-hidden="true">|</span>
          <button type="button" className="lang-btn" aria-pressed="false" aria-label="English">EN</button>
        </div>'''
          new_switcher = '''        <fieldset className="language-switcher">
          <legend className="sr-only">Chọn ngôn ngữ / Choose language</legend>
          <button type="button" className="lang-btn active" aria-pressed="true" aria-label="Tiếng Việt (Đang chọn / Selected)">VI</button>
          <span className="lang-divider" aria-hidden="true">|</span>
          <button type="button" className="lang-btn" aria-pressed="false" aria-label="English">EN</button>
        </fieldset>'''
          if s.count(old_switcher) != 1:
              raise SystemExit(f'language switcher anchor mismatch: {s.count(old_switcher)}')
          s = s.replace(old_switcher, new_switcher, 1)

          count = s.count('run("npx", "biome", "check",')
          if count != 2:
              raise SystemExit(f'expected two Biome gates, got {count}')
          s = s.replace('run("npx", "biome", "check",', 'run("npx", "biome", "check", "--write",')
          p.write_text(s, encoding='utf-8')
          PY
          python project_control/tools/ds002_003_patch.py
