name: DS-002-003 Once

on:
  push:
    branches:
      - oanhpham-kobe/DESIGN-SYSTEM-HARDENING-001

permissions:
  contents: write

concurrency:
  group: ds002-003-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Configure one-shot commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Repair focused test harness and apply DS-002/003
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('project_control/tools/ds002_003_patch.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          repaired = []
          replaced = 0
          for line in lines:
              if 'assert.match(layout, /pathname ===' in line:
                  repaired.append('  assert.ok(layout.includes(\'pathname === "/candidate"\'));')
                  replaced += 1
              else:
                  repaired.append(line)
          if replaced != 1:
              raise SystemExit(f'expected one design-shell regex line, got {replaced}')
          p.write_text('\n'.join(repaired) + '\n', encoding='utf-8')
          PY
          python project_control/tools/ds002_003_patch.py
