name: S05-002 R3 Final Verify

on:
  push:
    branches:
      - verify/S05-002-R3-final

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ensure npm 11.19.0
        run: |
          if [ "$(npm --version)" != "11.19.0" ]; then npm install --global npm@11.19.0; fi
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run design:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.116.0
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: supabase db reset
      - name: S05-001 contextual read regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -U postgres -d postgres < supabase/tests/interviewer_report_contextual_read_test.sql
      - name: S05-002 HR management regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -U postgres -d postgres < supabase/tests/hr_report_management_test.sql
      - name: S05-002 HR DTO privacy regression
        run: docker exec -i supabase_db_eiu-recruitment-dev psql -U postgres -d postgres < supabase/tests/hr_report_dto_privacy_test.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop
